<style>
  :root{
    --bg:#04060d; --ink:#e8ecf7; --dim:#8b93ad; --line:rgba(140,160,220,.18);
    --panel:rgba(7,10,20,.86); --acc:#9a8bff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);margin:0;padding:0;
    font-family:var(--sans);overscroll-behavior:none;}
  #wrap{position:relative;width:100%;height:100vh;height:100dvh;min-height:360px;
    overflow:hidden;background:var(--bg);}
  #gl,#ui{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
  #gl{touch-action:none;outline:none;}
  #ui{pointer-events:none;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  #gl:focus-visible{outline:2px solid var(--acc);outline-offset:-3px;}

  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;font-family:var(--mono);font-size:11.5px;
    line-height:1.55;color:var(--dim);backdrop-filter:blur(9px);}

  #hud{left:14px;top:14px;min-width:224px;max-width:min(360px,calc(100vw - 28px));}
  #hud b{color:var(--ink);font-weight:600;}
  #crumb{color:var(--ink);font-size:12.5px;margin-bottom:7px;
    display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;}
  #crumb i{color:var(--dim);font-style:normal;}
  #crumb button{font:inherit;color:var(--dim);background:none;border:0;padding:1px 3px;
    border-radius:5px;cursor:pointer;}
  #crumb button:hover{color:var(--ink);background:rgba(154,139,255,.16);}
  #crumb button[aria-current]{color:var(--ink);cursor:default;}
  #crumb button[aria-current]:hover{background:none;}
  #metrics{display:none;}
  body.debug #metrics{display:block;}
  #bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:9px;position:relative;}
  #barf{position:absolute;left:0;top:0;bottom:0;border-radius:2px;
    background:linear-gradient(90deg,#3d6dff,#9a6bff,#ff7a54);}
  #home{display:inline-block;margin-top:8px;color:var(--dim);text-decoration:none;font-size:13px;}
  #mapnav{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
  #mapnav a{color:var(--ink);font-size:13px}
  #mapzoom{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #mapzoom button{font:inherit;font-size:14px;color:var(--ink);background:rgba(154,139,255,.12);
    border:1px solid var(--line);border-radius:7px;padding:7px 12px;min-height:38px;cursor:pointer}
  #home:hover{color:var(--ink);}

  #keys{left:14px;bottom:14px;pointer-events:none;}
  .touch-only{display:none;}

  #card{right:14px;top:14px;width:288px;font-family:var(--sans);font-size:13px;
        pointer-events:none;opacity:0;transition:opacity .16s;}
  #card.on{opacity:1;pointer-events:auto;}
  #card .catalog-link{display:inline-block;margin-top:12px;padding:8px 0;color:var(--acc);font-size:14px}
  #card .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
     color:var(--acc);margin-bottom:3px;}
  #card .nm{color:var(--ink);font-size:15.5px;font-weight:600;line-height:1.3;margin-bottom:7px;
     overflow-wrap:anywhere;}
  #card .row{display:flex;gap:10px;justify-content:space-between;padding:2.5px 0;
     border-top:1px solid rgba(140,160,220,.10);}
  #card .row:first-of-type{border-top:0}
  #card .row i{font-style:normal;color:var(--dim);flex:none}
  #card .row u{text-decoration:none;color:var(--ink);text-align:right;overflow-wrap:anywhere}
  #card .hint{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

  /* Результаты растут вверх: поле остаётся там, куда его поставил курсор. */
  #find{right:14px;bottom:14px;width:288px;padding:0;overflow:hidden;font-family:var(--sans);
        display:flex;flex-direction:column-reverse;}
  #q{width:100%;border:0;outline:0;background:transparent;color:var(--ink);
     font-family:var(--sans);font-size:16px;padding:11px 13px;}
  #q::placeholder{color:var(--dim)}
  #q:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:10px;}
  #res{max-height:min(46vh,300px);overflow-y:auto}
  #res div[role=option]{padding:7px 13px;border-bottom:1px solid rgba(140,160,220,.10);
     cursor:pointer;font-size:12.5px;color:var(--ink);line-height:1.35}
  #res div[role=option]:hover,#res div[role=option].sel{background:rgba(154,139,255,.18)}
  #res div s{display:block;text-decoration:none;color:var(--dim);
     font-family:var(--mono);font-size:10.5px}
  #res .none{padding:9px 13px;color:var(--dim);font-family:var(--mono);font-size:11px;
     border-bottom:1px solid rgba(140,160,220,.10);}

  /* Запасное представление, когда WebGL2 недоступен: библиотека читается всё равно. */
  #nogl{position:absolute;inset:0;overflow-y:auto;padding:28px 20px 40px;
    font-family:var(--sans);color:var(--ink);}
  #nogl .in{max-width:720px;margin:0 auto;}
  #nogl h1{font-size:22px;margin:0 0 6px;font-weight:600;}
  #nogl p{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 22px;}
  #nogl h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
    margin:26px 0 10px;font-weight:600;}
  #nogl ol{margin:0;padding:0;list-style:none;display:grid;gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  #nogl li{background:#080c17;padding:9px 13px;display:flex;justify-content:space-between;
    gap:14px;font-size:13.5px;}
  #nogl li span{color:var(--dim);font-family:var(--mono);font-size:11.5px;flex:none;}
  #nogl a{color:var(--acc);}

  @media (max-width:760px), (pointer:coarse){
    .touch-only{display:inline;}
    .mouse-only{display:none;}
  }
  @media (max-width:760px){
    #hud{left:10px;right:10px;top:10px;min-width:0;max-width:none;padding:9px 11px;}
    #keys{left:10px;right:10px;bottom:61px;top:auto;font-size:10.5px;padding:7px 10px;}
    body.used #keys{display:none;}
    #card{left:10px;right:10px;top:auto;bottom:99px;width:auto;
      max-height:40vh;overflow-y:auto;}
    body.used #card{bottom:61px;}
    #find{left:10px;right:10px;bottom:10px;width:auto;}
    #res{max-height:38vh;}
  }
  @media (max-height:520px){
    #card{max-height:38vh;overflow-y:auto;}
    #res{max-height:30vh;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important;}
  }
</style>

   Две половины окрашены по-разному, и это само по себе утверждение:
   у академической есть время — она градиент; у повседневной времени нет,
   есть семьи — она мозаика.

   Градиент идёт от тёплого к холодному: старое тёплое, радикальное холодное.
   Раскладывается он по порядку эпох, а не по году. Год врёт: одиннадцать
   эпох из пятнадцати лежат после 1815-го, и на линейной шкале все они
   получали почти один оттенок — отсюда и бралось сиреневое пятно на обзоре. */

var TIME=[ [1.00,0.60,0.24],   /* охра        — самое раннее */
           [1.00,0.74,0.34],   /* золото                     */
           [1.00,0.86,0.60],   /* тёплый крем                */
           [1.00,0.62,0.56],   /* роза                       */
           [0.96,0.46,0.66],   /* пурпур                     */
           [0.78,0.46,0.96],   /* фиалка                     */
           [0.52,0.62,1.00],   /* холодная синь              */
           [0.62,0.88,1.00] ]; /* лёд         — самое позднее */
function ramp(t){
  t=Math.max(0,Math.min(0.9999,t))*(TIME.length-1);
  var i=Math.floor(t), f=t-i, a=TIME[i], b=TIME[i+1]||a;
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
var UNKNOWN=[0.56,0.60,0.70];  /* «эпоха не определена» — намеренно тусклый сланец */

/* Повседневная половина: восемь семей вместо двадцати двух случайных оттенков.
   Внутри семьи жанры различаются светимостью и размером, не цветом. */
var FAMILY={
  'Рок':[1.00,0.42,0.30], 'Британский рок':[1.00,0.42,0.30], 'Блюз':[0.98,0.52,0.36],
  'Поп':[1.00,0.50,0.70], 'Ретро-поп / рок':[1.00,0.50,0.70], 'Диско':[1.00,0.50,0.70],
  'Сезонная музыка':[1.00,0.50,0.70], 'Корейская инди-музыка':[1.00,0.50,0.70],
  'Электронная музыка':[0.30,0.84,0.98], 'Регги':[0.30,0.84,0.98],
  'Рэп / хип-хоп':[0.76,0.88,0.34],
  'R&B / соул / фанк':[1.00,0.70,0.26], 'Вокальная музыка':[1.00,0.70,0.26],
  'Джаз':[0.24,0.78,0.68],
  'Фолк':[0.58,0.80,0.52], 'Кантри':[0.58,0.80,0.52],
  'Латиноамериканская / мировая музыка':[0.58,0.80,0.52],
  'Саундтреки / мюзиклы':[0.66,0.62,1.00], 'Нью-эйдж':[0.66,0.62,1.00],
  'Инструментальная музыка':[0.66,0.62,1.00], 'Трибьюты / каверы':[0.66,0.62,1.00],
  'Жанр не найден':[0.56,0.60,0.70] };

/* Порядковый номер академической эпохи во времени — им и красим. */
var TORDER={}, TCOUNT=0;
(function(){
  var cl=[];
  GAL.forEach(function(g,gi){ if(g[1]===0&&g[2]>0) cl.push(gi); });
  cl.sort(function(a,b){ return GAL[a][2]-GAL[b][2]; });
  TCOUNT=cl.length;
  cl.forEach(function(gi,k){ TORDER[gi]=k; });
})();
function galCol(g,gi){
  if(g[1]===0){
    var k=TORDER[gi];
    return k===undefined ? UNKNOWN : ramp(TCOUNT<2?0.5:k/(TCOUNT-1));
  }
  return FAMILY[g[0]]||[0.56,0.60,0.70];
}
/* Ребёнок берёт цвет территории и чуть отклоняется по теплу — не по тону.
   Территория остаётся узнаваемой, а внутри неё появляется жизнь. */
function shade(c,t,lift){
  var w=[1.00,0.92,0.82];
  return [ c[0]+(w[0]-c[0])*lift + t*0.06,
           c[1]+(w[1]-c[1])*lift,
           c[2]+(w[2]-c[2])*lift - t*0.06 ];
}
function galKind(g){ var k=KIND[g[0]]; return k===undefined?9:k; }

/* ================================================================== раскладка
   Правило: структура, а не клякса. Классика — дуга времени, популярная —
   трёхрукавная спираль. Галактика — спиральный диск, рукав = группа
   направлений. Система — концентрические орбиты, кольцо за кольцом по годам. */

function fit(it, target){
  var mx=0,i,a;
  for(i=0;i<it.length;i++){ a=it[i];
    var d=Math.sqrt(a.x*a.x+a.y*a.y)+a.r; if(d>mx) mx=d; }
  if(mx<=1e-9) return;
  var k=target/mx;
  for(i=0;i<it.length;i++){ it[i].x*=k; it[i].y*=k; it[i].r*=k; }
}
function relax(it, R, iters, pull){
  for(var t=0;t<iters;t++){
    for(var i=0;i<it.length;i++){
      var a=it[i];
      for(var j=i+1;j<it.length;j++){
        var b=it[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1e-6;
        var need=(a.r+b.r)*1.16;
        if(d<need){ var f=(need-d)/d*0.5; a.x-=dx*f; a.y-=dy*f; b.x+=dx*f; b.y+=dy*f; }
      }
      if(pull>0){ a.x+=(a.tx-a.x)*pull; a.y+=(a.ty-a.y)*pull; }
      if(a.lx!==undefined) a.x+=(a.lx-a.x)*0.42;
      var dd=Math.sqrt(a.x*a.x+a.y*a.y), lim=R-a.r;
      if(dd>lim&&dd>0){ var s=lim/dd; a.x*=s; a.y*=s; }
    }
  }
}
function spiral(items, arms, turns, flat){
  var byArm={}, i;
  for(i=0;i<items.length;i++){ var a=items[i].arm%arms;
    (byArm[a]=byArm[a]||[]).push(items[i]); }
  for(var k=0;k<arms;k++){
    var L=byArm[k]||[], m=L.length;
    for(i=0;i<m;i++){
      var t=(i+0.65)/(m+0.35);
      var th=t*turns*6.2832 + k*6.2832/arms;
      var rr=0.15+0.79*Math.pow(t,0.60);
      L[i].x=Math.cos(th)*rr; L[i].y=Math.sin(th)*rr*flat;
      L[i].tx=L[i].x; L[i].ty=L[i].y;
    }
  }
}
function jit(i,k){ var x=Math.sin((i+1)*12.9898+k*78.233)*43758.5453; return x-Math.floor(x); }
function orbits(items){
  var n=items.length;
  if(n===1){ items[0].x=0; items[0].y=0; items[0].ring=0; return [0.55]; }
  var rings=Math.max(1,Math.round(Math.sqrt(n/1.7))), cap=[], tot=0, r;
  for(r=0;r<rings;r++){ cap[r]=r+1.6; tot+=cap[r]; }
  var idx=0, radii=[];
  for(r=0;r<rings;r++){
    var cnt=(r===rings-1)?(n-idx):Math.max(1,Math.round(n*cap[r]/tot));
    if(cnt<1) cnt=1; if(idx+cnt>n) cnt=n-idx;
    var rad=0.20+0.74*((r+1)/rings), ph=r*1.03;
    radii.push(rad);
    for(var i=0;i<cnt;i++){
      var it=items[idx];
      var a=ph+(i+0.44*(jit(idx,1)-0.5))*6.2832/cnt;
      var rj=rad*(1.0+0.048*(jit(idx,2)-0.5));
      it.x=Math.cos(a)*rj; it.y=Math.sin(a)*rj*0.90; it.ring=r;
      var arc=6.2832*rad/Math.max(cnt,2)*0.42, gap=0.74/rings*0.42;
      it.r=Math.min(it.r, arc, gap)*(0.84+0.40*jit(idx,3));
      idx++;
    }
    if(idx>=n) break;
  }
  return radii;
}

var UID=1;
function node(o){ o.id=UID++; o.seed=(o.id*0.6180339887)%1; return o; }
var BUILD0=performance.now();

var root=node({name:'Музыка',level:0,x:0,y:0,rad:1,col:[.62,.70,1],kind:1,
  n:SUP[0][1]+SUP[1][1],children:[]});

var supN=[], maxSup=Math.max(SUP[0][1],SUP[1][1]);
var supPos=[[-0.505,0.035],[0.545,-0.045]];
for(var i=0;i<2;i++){
  var rr=0.455*Math.pow(SUP[i][1]/maxSup,0.30);
  supN.push(node({name:SUP[i][0],level:1,x:supPos[i][0],y:supPos[i][1],rad:rr,
    col:i===0?[0.34,0.40,0.78]:[0.62,0.34,0.56],kind:1,n:SUP[i][1],
    children:[],parent:root}));
}
root.children=supN;

var galN=[], bySup=[[],[]];
GAL.forEach(function(g,gi){ bySup[g[1]].push(gi); });
for(var s=0;s<2;s++){
  var list=bySup[s], P=supN[s], items=[], mx=0;
  list.forEach(function(gi){ mx=Math.max(mx,GAL[gi][3]); });
  var withYear=list.filter(function(gi){ return GAL[gi][2]>0; })
                   .sort(function(a,b){ return GAL[a][2]-GAL[b][2]; });
  var yi={}; withYear.forEach(function(gi,k){ yi[gi]=k; });
  var bySize=list.slice().sort(function(a,b){ return GAL[b][3]-GAL[a][3]; });
  bySize.forEach(function(gi,k){
    var g=GAL[gi], rr=0.30*Math.pow(g[3]/mx,0.40);
    items.push({gi:gi,r:rr,arm:k%3,x:0,y:0,tx:0,ty:0});
  });
  if(s===0){
    items.forEach(function(a,k){
      var q=yi[a.gi];
      var t = (q!==undefined&&withYear.length>1) ? q/(withYear.length-1)
            : (k%2?1.05:-0.05);
      var xx=-0.80+1.60*t;
      a.x=xx; a.y=0.34*Math.sin(xx*1.85)+(hash(GAL[a.gi][0])-0.5)*0.20;
      a.tx=a.x; a.ty=a.y; a.lx=xx;
    });
  } else {
    spiral(items,3,0.72,0.86);
  }
  relax(items,0.95,120,0.05); fit(items,0.93);
  items.forEach(function(a){
    var g=GAL[a.gi], base=galCol(g,a.gi);
    galN[a.gi]=node({name:g[0],level:2,x:P.x+a.x*P.rad,y:P.y+a.y*P.rad,rad:P.rad*a.r*0.86,
      base:base,col:base,kind:galKind(g),n:g[3],
      year:g[2],epoch:g[4],children:[],parent:P,sup:s});
  });
  P.children=list.map(function(gi){ return galN[gi]; });
}

var sysN=[], byGal={};
SYS.forEach(function(y,si){ (byGal[y[1]]=byGal[y[1]]||[]).push(si); });
Object.keys(byGal).forEach(function(gk){
  var list=byGal[gk], P=galN[+gk], mx=0, subs={}, nsub=0;
  list.forEach(function(si){ mx=Math.max(mx,SYS[si][3]);
    var b=SYS[si][2]; if(subs[b]===undefined) subs[b]=nsub++; });
  var arms=list.length<7?1:(nsub>=3?3:2);
  var items=list.slice().sort(function(a,b){ return SYS[b][3]-SYS[a][3]; })
    .map(function(si){
      return {si:si,r:0.30*Math.pow(SYS[si][3]/mx,0.36),
              arm:arms===1?0:subs[SYS[si][2]]%arms,x:0,y:0,tx:0,ty:0}; });
  if(arms===1) orbits(items); else spiral(items,arms,0.80,0.88);
  relax(items,0.94,list.length>240?24:70,0.10); fit(items,0.93);
  items.forEach(function(a){
    var y=SYS[a.si], hh=hash(y[0]);
    sysN[a.si]=node({name:y[0],level:3,x:P.x+a.x*P.rad,y:P.y+a.y*P.rad,rad:P.rad*a.r*0.70,
      base:P.base,col:shade(P.base,(hh-0.5)*2,0.10+hh*0.10),
      kind:(P.kind+(hh<0.26?1:0))%10,
      n:y[3],artist:y[4],sub:SUB[y[2]],children:[],parent:P});
  });
  P.children=list.map(function(si){ return sysN[si]; });
});

var trkN=[], bySys={};
TRK.forEach(function(t,ti){ (bySys[t[1]]=bySys[t[1]]||[]).push(ti); });
Object.keys(bySys).forEach(function(sk){
  var list=bySys[sk], P=sysN[+sk];
  list.sort(function(a,b){ return (TRK[a][2]||0)-(TRK[b][2]||0); });
  var n=list.length;
  var items=list.map(function(ti){
    return {ti:ti,top:TRK[ti][3]>0,r:Math.min(0.24,0.90/Math.sqrt(n+1)),x:0,y:0}; });
  var radii=orbits(items);
  items.forEach(function(a){ if(a.top) a.r*=1.22; });
  fit(items,0.93);
  P.rings=radii.map(function(r){ return r*0.93; });
  P.children=items.map(function(a){
    var t=TRK[a.ti], th=hash(t[0]);
    return trkN[a.ti]=node({name:t[0],level:4,
      x:P.x+a.x*P.rad, y:P.y+a.y*P.rad, rad:P.rad*a.r*0.80,
      base:P.base,col:shade(P.base,a.top?0.9:(th-0.5)*1.4,a.top?0.52:0.24+th*0.16),
      kind:1,n:1,
      year:t[2],rank:t[3],children:[],parent:P});
  });
});

var LINKS=[], BRIDGE;
(function(){
  var cl=bySup[0].filter(function(gi){ return GAL[gi][2]>0; })
                 .sort(function(a,b){ return GAL[a][2]-GAL[b][2]; });
  for(var i=0;i+1<cl.length;i++) LINKS.push([galN[cl[i]],galN[cl[i+1]],2]);
  var byName={};
  SYS.forEach(function(y){ (byName[y[0]]=byName[y[0]]||{})[y[1]]=1; });
  var pair={};
  Object.keys(byName).forEach(function(nm){
    var gs=Object.keys(byName[nm]); if(gs.length<2) return;
    for(var a=0;a<gs.length;a++) for(var b=a+1;b<gs.length;b++){
      var k=Math.min(gs[a],gs[b])+'|'+Math.max(gs[a],gs[b]); pair[k]=(pair[k]||0)+1; }
  });
  Object.keys(pair).forEach(function(k){
    if(pair[k]<2) return; var p=k.split('|'), A=galN[+p[0]], B=galN[+p[1]];
    if(!A||!B||A.parent!==B.parent) return;
    LINKS.push([A,B,Math.min(pair[k],6)]);
  });
  LINKS.forEach(function(L){ L[3]=(hash(L[0].name+L[1].name)-0.5)*0.24;
    L[4]=(hash(L[1].name)-0.5)*0.24; });
  BRIDGE=[supN[0],supN[1]];
})();

  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }

/* Фон — не астрофото, а подложка: мягкая туманность и редкие звёзды в двух
   планах. Глубина берётся параллаксом и светом, ничто ничего не перекрывает:
   поглощающий слой пыли здесь уже пробовали, и он съедал картинку. */

  if(lN){ gl.useProgram(pLnk); gl.bindVertexArray(vaoL);
    gl.bindBuffer(gl.ARRAY_BUFFER,lBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,lArr,0,lN*7);
    gl.uniform2f(uL.uRes,W,H); gl.drawArrays(gl.TRIANGLES,0,lN); }
  if(dN){ gl.useProgram(pDot); gl.bindVertexArray(vaoD);
    gl.bindBuffer(gl.ARRAY_BUFFER,dBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,dArr,0,dN*8);
    gl.uniform2f(uD.uRes,W,H); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,dN); }
  forms.sort(function(a,b){return b[2]-a[2];});
  var used=0, nf=0;
  for(var q=0;q<forms.length&&nf<28;q++){ var ar=2.7*forms[q][2]; ar*=ar;
    if(used+ar>areaB&&nf>0) break; used+=ar; nf++; }
  gl.useProgram(pFrm); gl.bindVertexArray(vaoQ); gl.uniform2f(uF.uRes,W,H); gl.uniform1f(uF.uT,REDUCE?0.0:TT);
  for(var i=0;i<nf;i++){ var f=forms[i];
    gl.uniform2f(uF.uC,f[0],f[1]); gl.uniform1f(uF.uR,f[2]);
    gl.uniform3f(uF.uCol,f[3].col[0],f[3].col[1],f[3].col[2]);
    gl.uniform1f(uF.uSeed,f[3].seed); gl.uniform1f(uF.uA,Math.min(1,f[4]));
    gl.uniform1i(uF.uKind,f[3].kind|0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }
  stat.f=nf;

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H); gl.disable(gl.BLEND);
  gl.useProgram(pTone); gl.bindVertexArray(vaoQ);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fboT);
  gl.uniform1i(uT.uTex,0); gl.uniform1f(uT.uExp,EXPO);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindVertexArray(null);
  drawLabels();
  return path;
}
/* подписи: сначала крупные и верхнеуровневые, пересечения отбрасываются */
function drawLabels(){
  ux.setTransform(1,0,0,1,0,0); ux.clearRect(0,0,W,H); ux.scale(DPR,DPR);
  ux.textAlign='center'; ux.textBaseline='top';
  labels.sort(function(a,b){ return a[5]===b[5] ? b[2]-a[2] : a[5]-b[5]; });
  var placed=[], k=0, VW=W/DPR, VH=H/DPR;
  for(var j=0;j<labels.length&&k<34;j++){
    var L=labels[j], lv=L[5];
    ux.font=(lv<=1?'600 13.5px ':(lv===2?'600 12.5px ':(lv===3?'12px ':'11px ')))+
      'Inter,system-ui,sans-serif';
    var txt=L[3].length>32?L[3].slice(0,31)+'…':L[3];
    var w=ux.measureText(txt).width, h=15;
    var x=L[0]/DPR, y=(L[1]+L[2]*1.02)/DPR+7;
    var b=[x-w/2-5,y-2,x+w/2+5,y+h];
    var ok=(b[2]>0&&b[0]<VW&&b[3]>0&&b[1]<VH);
    for(var q=0;ok&&q<placed.length;q++){ var o=placed[q];
      if(b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]) ok=false; }
    if(!ok) continue;
    placed.push(b); k++;
    ux.fillStyle='rgba(6,9,18,0.55)';
    ux.fillRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);
    ux.fillStyle='rgba(233,238,250,'+(Math.min(1,L[4])*(lv<=2?0.96:0.74)).toFixed(3)+')';
    ux.fillText(txt,x,y);
  }
}
/* Узлы интерфейса берутся один раз: раньше их искали заново каждый кадр,
   а крошки переписывались через innerHTML шестьдесят раз в секунду. */
var elCrumb=document.getElementById('crumb'), elBar=document.getElementById('barf'),
    elMz=document.getElementById('mz'), elMn=document.getElementById('mn'),
    elMf=document.getElementById('mf'), elMt=document.getElementById('mt');
var crumbHTML='';
function drawCrumb(path){
  var h='<button type="button" data-i="-1">Музыка</button>';
  for(var i=0;i<path.length;i++)
    h+='<i>\u203a</i><button type="button" data-i="'+i+'"'+
       (i===path.length-1?' aria-current="true"':'')+'>'+esc(path[i])+'</button>';
  if(h!==crumbHTML){ crumbHTML=h; elCrumb.innerHTML=h; }
}
elCrumb.addEventListener('click',function(e){
  var b=e.target.closest('button[data-i]'); if(!b) return;
  var i=+b.dataset.i, ns=crumb.nodes||[];
  sel=null; hover=null; card(null);
  if(i<0){ fly=null; gz=GZMIN; view.x=0.02; view.y=0.0; }
  else if(ns[i]) flyTo(ns[i]);
});

var RAF=0;
function frame(now){
  if(fly){ var t=Math.min(1,(now-fly.t0)/fly.dur), e=t*t*(3-2*t), v=fly.i.at(e);
    view.x=v[0]; view.y=v[1]; gz=W/Math.max(v[2],1e-9); if(t>=1) fly=null; }
  gz=Math.max(GZMIN,Math.min(GZMAX,gz));
  var path=render(now);
  var dt=now-(frame.last||now); frame.last=now; fpsA=fpsA*0.9+dt*0.1;
  if(fpsA>26) areaB=Math.max(4e5,areaB*0.90); else if(fpsA<17) areaB=Math.min(6e6,areaB*1.05);
  drawCrumb(path);
  if(DEBUG){ elMz.textContent='\u00d7'+fmt(gz/GZ0); elMn.textContent=stat.n;
    elMf.textContent=stat.f; elMt.textContent=fpsA.toFixed(1)+' \u043c\u0441'; }
  elBar.style.width=(2+Math.log(gz/GZMIN)/Math.log(GZMAX/GZMIN)*98).toFixed(1)+'%';
  RAF=requestAnimationFrame(frame);
}
/* В невидимой вкладке считать нечего. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ if(RAF) cancelAnimationFrame(RAF); RAF=0; }
  else if(!RAF){ T0=performance.now()-TT*1000; frame.last=0; RAF=requestAnimationFrame(frame); }
});
function esc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function fmt(v){ if(v<10) return v.toFixed(1); if(v<1000) return Math.round(v)+'';
  var e=Math.floor(Math.log10(v)); return (v/Math.pow(10,e)).toFixed(1)+'·10'+
    String(e).replace(/\d/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d];}); }

/* ================================================================== карточка */
var LV=['','сверхскопление','жанр · эпоха','автор','трек'];
function card(n){
  var el=document.getElementById('card');
  if(!n){ el.className='panel'; el.innerHTML=''; return; }
  var h='<div class="k">'+LV[n.level]+'</div><div class="nm">'+esc(n.name)+'</div>';
  function row(k,v){ h+='<div class="row"><i>'+k+'</i><u>'+esc(String(v))+'</u></div>'; }
  if(n.level===1){ row('треков',n.n); row('жанров',n.children.length); }
  else if(n.level===2){
    row('треков',n.n); row('авторов',n.children.length);
    if(n.year) row('с',n.year+' года');
    var sb={},top=[]; n.children.forEach(function(c){ sb[c.sub]=(sb[c.sub]||0)+c.n; });
    Object.keys(sb).forEach(function(k){ if(k!=='—') top.push([k,sb[k]]); });
    top.sort(function(a,b){return b[1]-a[1];});
    if(top.length) row('направления',top.slice(0,3).map(function(t){return t[0];}).join(', '));
  }
  else if(n.level===3){
    row('треков',n.n); if(n.sub&&n.sub!=='—') row('направление',n.sub);
    row('в разделе',n.parent.name);
    var yy=n.children.map(function(c){return c.year;}).filter(function(y){return y>0;});
    if(yy.length) row('релизы',Math.min.apply(null,yy)+'–'+Math.max.apply(null,yy));
    var hot=n.children.filter(function(c){return c.rank>0;}).length;
    if(hot) row('в топах Replay',hot);
  }
  else if(n.level===4){
    row('автор',n.parent.name); row('жанр',n.parent.parent.name);
    if(n.year) row('год',n.year);
    if(n.rank>0) row('Replay','место '+n.rank);
  }
  h+='<div class="hint">'+(n.level===4?'Откройте запись в каталоге, чтобы послушать превью'
      :'клик — полёт внутрь')+'</div>';
  var filter=n.level===1?'r='+(n===supN[0]?1:0):
    n.level===2?'ep='+n.epoch+'&r='+(1-n.sup):
    n.level===3?'art='+n.artist+'&ep='+n.parent.epoch:
    'art='+n.parent.artist+'&q='+encodeURIComponent(n.name);
  h+='<a class="catalog-link" href="11-library.html#'+filter+'">'+
    (n.level===4?'Найти и послушать →':'Открыть в каталоге →')+'</a>';
  el.innerHTML=h; el.className='panel on';
}

/* ==================================================================== поиск
   Приведение к общему виду: регистр, ё, диакритика, лишние пробелы. Если по
   набранному ничего нет — пробуем ту же строку в другой раскладке: «,f[» это
   «бах», набранный не переключившись. */
function norm(t){
  t=t.toLowerCase().replace(/ё/g,'е');
  if(t.normalize) t=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return t.replace(/\s+/g,' ').trim();
}
var LAYEN="qwertyuiop[]asdfghjkl;'zxcvbnm,./`",
    LAYRU="йцукенгшщзхъфывапролджэячсмитьбю.ё";
function swapLayout(t){ var o='',k;
  for(var i=0;i<t.length;i++){ k=LAYEN.indexOf(t[i]); o+=(k>=0?LAYRU[k]:t[i]); }
  return norm(o); }

var INDEX=[];
(function(){
  function add(n){ if(n) INDEX.push([norm(n.name),n,n.parent.name]); }
  galN.forEach(add); sysN.forEach(add); trkN.forEach(add);
})();

var qEl=document.getElementById('q'), rEl=document.getElementById('res');
var hits=[], cursor=-1;

function lookup(q){
  var out=[], seen={}, i, k;
  function push(r,rank){ if(seen[r[1].id]) return; seen[r[1].id]=1; out.push([r,rank]); }
  for(i=0;i<INDEX.length;i++){
    k=INDEX[i][0].indexOf(q);
    if(k===0) push(INDEX[i],0);
    else if(k>0) push(INDEX[i], INDEX[i][0].charAt(k-1)===' ' ? 1 : 2);
    if(out.length>=400) break;
  }
  out.sort(function(a,b){
    if(a[1]!==b[1]) return a[1]-b[1];
    if(a[0][1].level!==b[0][1].level) return a[0][1].level-b[0][1].level;
    return b[0][1].n-a[0][1].n;
  });
  return out.slice(0,8).map(function(x){ return x[0]; });
}

function draw(){
  qEl.removeAttribute('aria-activedescendant');
  if(!hits.length){
    rEl.innerHTML='<div class="none">ничего не найдено</div>';
    qEl.setAttribute('aria-expanded','false'); return;
  }
  rEl.innerHTML=hits.map(function(r,k){
    return '<div role="option" id="opt'+k+'" data-k="'+k+'"'+
      (k===cursor?' class="sel" aria-selected="true"':' aria-selected="false"')+'>'+
      esc(r[1].name.slice(0,52))+'<s>'+LV[r[1].level]+' · '+esc(r[2])+'</s></div>'; }).join('');
  qEl.setAttribute('aria-expanded','true');
  if(cursor>=0){ qEl.setAttribute('aria-activedescendant','opt'+cursor);
    var el=rEl.children[cursor]; if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
}
function closeRes(){ hits=[]; cursor=-1; rEl.innerHTML='';
  qEl.setAttribute('aria-expanded','false'); qEl.removeAttribute('aria-activedescendant'); }
function choose(k){
  var n=hits[k]&&hits[k][1]; if(!n) return;
  sel=n; card(n); flyTo(n); closeRes(); qEl.value=''; qEl.blur(); cv.focus();
}
qEl.addEventListener('input',function(){
  var q=norm(qEl.value);
  if(q.length<2){ closeRes(); return; }
  hits=lookup(q);
  if(!hits.length){ var alt=swapLayout(q); if(alt!==q&&alt.length>1) hits=lookup(alt); }
  cursor=-1; draw();
});
qEl.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!hits.length) return;
    e.preventDefault();
    if(e.key==='ArrowDown') cursor = (cursor+1>=hits.length) ? 0 : cursor+1;
    else                     cursor = (cursor<=0) ? hits.length-1 : cursor-1;
    qEl.setAttribute('aria-activedescendant','opt'+cursor); draw(); return;
  }
  if(e.key==='Enter'){ e.preventDefault(); choose(cursor<0?0:cursor); return; }
  if(e.key==='Escape'){ e.stopPropagation();
    if(hits.length||rEl.innerHTML){ closeRes(); } else { qEl.value=''; qEl.blur(); cv.focus(); } }
});
rEl.addEventListener('click',function(e){
  var d=e.target.closest('div[data-k]'); if(d) choose(+d.dataset.k);
});

/* ==================================================================== ввод */
function mouse(e){ var r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*DPR,(e.clientY-r.top)*DPR]; }
function clampZ(z){ return Math.max(GZMIN,Math.min(GZMAX,z)); }
/* Зум вокруг точки: мировая точка под курсором остаётся под курсором. */
function zoomAt(px,py,k){
  var wx=view.x+(px-W*0.5)/gz, wy=view.y+(py-H*0.5)/gz;
  gz=clampZ(gz*k);
  view.x=wx-(px-W*0.5)/gz; view.y=wy-(py-H*0.5)/gz;
}
function hitAt(m){
  var best=null,bd=1e9;
  for(var i=0;i<pick.length;i++){ var p=pick[i], dx=p[0]-m[0], dy=p[1]-m[1];
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<Math.max(p[2],15*DPR)&&d<bd){bd=d;best=p[3];} }
  return best;
}
document.getElementById('mapzoom').addEventListener('click',function(e){
  var button=e.target.closest('button[data-zoom]'); if(!button) return;
  var action=button.dataset.zoom;
  document.body.classList.add('used');
  if(action==='up'){ levelUp(); return; }
  fly=null;
  if(action==='home'){
    gz=GZMIN; view.x=0.02; view.y=0; sel=hover=null; card(null);
  } else zoomAt(W/2,H/2,action==='in'?1.5:1/1.5);
});
cv.addEventListener('wheel',function(e){ e.preventDefault(); fly=null;
  var m=mouse(e); zoomAt(m[0],m[1],Math.exp(-e.deltaY*0.0016)); },{passive:false});

/* Указатели считаются все: один — панорама, два — щипок.
   Так карта работает пальцами, а не только колесом мыши. */
var pts={}, npts=0, drag=null, moved=0, pinch=null, lastTap=0, lastPos=null;
function pinchNow(){
  var k=Object.keys(pts); if(k.length<2) return null;
  var a=pts[k[0]], b=pts[k[1]];
  return {cx:(a[0]+b[0])*0.5, cy:(a[1]+b[1])*0.5,
          d:Math.max(1,Math.sqrt((b[0]-a[0])*(b[0]-a[0])+(b[1]-a[1])*(b[1]-a[1])))};
}
cv.addEventListener('pointerdown',function(e){
  document.body.classList.add('used');
  cv.setPointerCapture(e.pointerId);
  if(!pts[e.pointerId]) npts++;
  pts[e.pointerId]=mouse(e); lastPos=pts[e.pointerId];
  if(npts>=2){ drag=null; pinch=pinchNow(); }
  else { drag=lastPos; moved=0; fly=null; }
});
cv.addEventListener('pointermove',function(e){
  if(!pts[e.pointerId]&&npts>0&&!drag) return;
  var m=mouse(e);
  if(pts[e.pointerId]){ pts[e.pointerId]=m; lastPos=m; }
  if(npts>=2){
    var st=pinchNow();
    if(st&&pinch){
      fly=null;
      var wx=view.x+(pinch.cx-W*0.5)/gz, wy=view.y+(pinch.cy-H*0.5)/gz;
      gz=clampZ(gz*st.d/pinch.d);
      view.x=wx-(st.cx-W*0.5)/gz; view.y=wy-(st.cy-H*0.5)/gz;
      moved+=Math.abs(st.cx-pinch.cx)+Math.abs(st.cy-pinch.cy)+Math.abs(st.d-pinch.d);
    }
    pinch=st; return;
  }
  if(drag){ fly=null; view.x-=(m[0]-drag[0])/gz; view.y-=(m[1]-drag[1])/gz;
    moved+=Math.abs(m[0]-drag[0])+Math.abs(m[1]-drag[1]); drag=m; return; }
  var best=hitAt(m);
  if(best!==hover){ hover=best; card(best||sel); }
  cv.style.cursor=best?'pointer':'grab';
});
function endPointer(e){
  if(pts[e.pointerId]){ delete pts[e.pointerId]; npts=Math.max(0,npts-1); }
  if(npts<2) pinch=null;
  if(npts===0){
    var wasDrag=drag; drag=null;
    if(wasDrag&&moved<8*DPR&&lastPos){
      var now=performance.now();
      if(now-lastTap<320){ lastTap=0; levelUp(); return; }
      lastTap=now;
      var n=hitAt(lastPos);
      if(n){ sel=n; hover=n; card(sel); flyTo(n); }
    }
  } else { var k=Object.keys(pts); drag=pts[k[0]]; }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);

/* Навигация с клавиатуры: стрелки — к соседу по той же ветке, Enter — внутрь,
   Esc — на уровень выше, а не в произвольный масштаб. */
function current(){
  if(sel) return sel;
  var ns=crumb.nodes||[]; return ns.length?ns[ns.length-1]:null;
}
function levelUp(){
  var cur=current(), ns=crumb.nodes||[];
  var up = cur&&cur.parent ? cur.parent : (ns.length>1?ns[ns.length-2]:root);
  sel=null; hover=null; card(null);
  if(up===root){ fly=null; gz=GZMIN; view.x=0.02; view.y=0.0; }
  else flyTo(up);
}
function nearest(cur,dx,dy){
  var sib=(cur.parent&&cur.parent.children)||[], best=null, bs=1e18;
  for(var i=0;i<sib.length;i++){ var c=sib[i]; if(c===cur) continue;
    var vx=c.x-cur.x, vy=c.y-cur.y, d=Math.sqrt(vx*vx+vy*vy)||1e-9;
    var dot=(vx*dx+vy*dy)/d;
    if(dot<0.34) continue;
    var score=d/(0.34+dot);
    if(score<bs){ bs=score; best=c; }
  }
  return best;
}
function goInto(){
  var cur=current();
  if(!cur){ var r=root.children[0]; if(r){ sel=r; card(r); flyTo(r); } return; }
  var ch=cur.children;
  if(!ch||!ch.length) return;
  var best=ch[0];
  for(var i=1;i<ch.length;i++) if(ch[i].n>best.n) best=ch[i];
  sel=best; card(best); flyTo(best);
}
window.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(document.activeElement&&document.activeElement.closest('input,button,a,select,textarea')) return;
  if(e.key==='/'){ e.preventDefault(); qEl.focus(); return; }
  if(e.key==='Escape'||e.key==='Backspace'){ e.preventDefault(); levelUp(); return; }
  if(e.key==='Enter'){ e.preventDefault(); goInto(); return; }
  var d=null;
  if(e.key==='ArrowLeft') d=[-1,0]; else if(e.key==='ArrowRight') d=[1,0];
  else if(e.key==='ArrowUp') d=[0,-1]; else if(e.key==='ArrowDown') d=[0,1];
  if(!d) return;
  e.preventDefault();
  var cur=current();
  if(!cur){ var r=root.children[0]; if(r){ sel=r; card(r); flyTo(r); } return; }
  var nx=nearest(cur,d[0],d[1]);
  if(nx){ sel=nx; hover=nx; card(nx); flyTo(nx); }
});

function flyTo(n){
  var w0=W/gz, w1=Math.max(1e-9,n.rad*(n.level>=4?9:2.9));
  fly={t0:performance.now(),i:interpZoom([view.x,view.y,w0],[n.x,n.y,w1])};
  fly.dur=REDUCE?200:Math.max(800,Math.min(2400,Math.abs(fly.i.S)*620));
}
function interpZoom(p0,p1){
  var rho=Math.SQRT2, rho2=2, rho4=4;
  var ux0=p0[0],uy0=p0[1],w0=p0[2], ux1=p1[0],uy1=p1[1],w1=p1[2];
  var dx=ux1-ux0, dy=uy1-uy0, d2=dx*dx+dy*dy;
  if(d2<1e-18){ var S0=Math.log(w1/w0)/rho;
    return {S:S0,at:function(t){ return [ux0,uy0,w0*Math.exp(rho*S0*t)]; }}; }
  var d1=Math.sqrt(d2),
      b0=(w1*w1-w0*w0+rho4*d2)/(2*w0*rho2*d1),
      b1=(w1*w1-w0*w0-rho4*d2)/(2*w1*rho2*d1),
      r0=Math.log(Math.sqrt(b0*b0+1)-b0),
      r1=Math.log(Math.sqrt(b1*b1+1)-b1), S=(r1-r0)/rho;
  return {S:S,at:function(t){ var s=t*S, ch0=Math.cosh(r0),
      u=w0/(rho2*d1)*(ch0*Math.tanh(rho*s+r0)-Math.sinh(r0));
    return [ux0+u*dx, uy0+u*dy, w0*ch0/Math.cosh(rho*s+r0)]; }};
}

/* ============================================================== диагностика */
window.tree=root;
window.setTarget=function(v){ TARGETL=v; return TARGETL; };
window.probe=function(z,tx,ty){ var s=[gz,view.x,view.y]; gz=z; view.x=tx; view.y=ty;
  dN=0;lN=0;forms.length=0;labels.length=0;pick.length=0;
  var cnt={n:0,lv:[0,0,0,0,0]}; traverse(root,0,cnt);
  var o={n:cnt.n,lv:cnt.lv.join('/'),forms:forms.length,labels:labels.length};
  gz=s[0];view.x=s[1];view.y=s[2]; return o; };
window.shot=function(z,tx,ty){
  var s=[gz,view.x,view.y];
  if(z){ gz=Math.max(GZMIN,Math.min(GZMAX,z)); view.x=tx; view.y=ty; }
  for(var w=0;w<70;w++) render(performance.now());   /* дать экспозиции устояться */
  var px=new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
  var sum=0,clip=0,bright=0,dark=0,N=W*H,i,r,g,b,L;
  for(i=0;i<N;i++){ r=px[i*4];g=px[i*4+1];b=px[i*4+2];
    L=0.2126*r+0.7152*g+0.0722*b; sum+=L;
    if(r>246&&g>246&&b>246) clip++;
    if(L>190) bright++; if(L<10) dark++; }
  gz=s[0];view.x=s[1];view.y=s[2];
  return {mean:+(sum/N).toFixed(1),clip:+(clip*100/N).toFixed(2),
    bright:+(bright*100/N).toFixed(2),dark:+(dark*100/N).toFixed(1),
    obj:stat.n,forms:stat.f,expo:+EXPO.toFixed(2),est:+stat.est.toFixed(4)}; };
window.audit=function(steps){
  steps=steps||160; var sw=W,sh=H; if(sw<10){W=1440;H=880;}
  var sx=view.x, sy=view.y, sz=gz;
  var g=root.children[0].children[0], y=g.children[0], t=y.children[0];
  var path=interpZoom([0.02,0,W/GZMIN],[t.x,t.y,W/GZMAX]);
  var res=[], minN=1e9, maxN=0;
  for(var i=0;i<steps;i++){
    var v=path.at(i/(steps-1)); view.x=v[0]; view.y=v[1]; gz=W/v[2];
    var cnt={n:0,count:true,lv:[0,0,0,0,0]}; traverse(root,0,cnt);
    res.push([+(gz/GZ0).toFixed(1),cnt.n,cnt.lv.join('/')]);
    if(cnt.n<minN)minN=cnt.n; if(cnt.n>maxN)maxN=cnt.n;
  }
  view.x=sx;view.y=sy;gz=sz;W=sw;H=sh;
  return {target:t.name,minVisible:minN,maxVisible:maxN,
    sample:res.filter(function(_,i){return i%24===0;})};
};
window.stats=function(){ return {buildMs:+BUILDMS.toFixed(0),hdr:HDR,gz0:+GZ0.toFixed(0),W:W,H:H,
  sup:root.children.length,gal:galN.filter(Boolean).length,
  sys:sysN.filter(Boolean).length,trk:trkN.filter(Boolean).length,
  links:LINKS.length,index:INDEX.length}; };
window.checkGL=function(){ return {err:gl.getError(),
  progs:[pWeb,pDot,pLnk,pFrm,pTone].map(function(p){return gl.getProgramParameter(p,gl.LINK_STATUS);})}; };

resize();
if(window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
else window.addEventListener('resize',resize);
RAF=requestAnimationFrame(frame);
})();
</script>
