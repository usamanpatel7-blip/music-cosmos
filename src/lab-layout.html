<title>Раскладки Music Cosmos</title>
<meta name="description" content="Шесть вариантов геометрии уровня на настоящих телах библиотеки — для выбора раскладки.">
<style>
  :root{
    --bg:#04060d; --chrome:#080c17; --ink:#e8ecf7; --dim:#8b93ad;
    --line:rgba(140,160,220,.18); --acc:#9a8bff; --gold:#ffc24a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:420px;}
  #bar{flex:none;background:var(--chrome);border-bottom:1px solid var(--line);
    padding:9px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;}
  #tabs{display:flex;gap:0;flex-wrap:wrap;}
  #tabs button{background:none;border:1px solid var(--line);border-right-width:0;
    color:var(--dim);font-family:var(--sans);font-size:12.5px;padding:7px 11px;cursor:pointer;
    white-space:nowrap;transition:color .14s,background .14s;}
  #tabs button:first-child{border-radius:8px 0 0 8px}
  #tabs button:last-child{border-radius:0 8px 8px 0;border-right-width:1px}
  #tabs button:hover{color:var(--ink);background:rgba(154,139,255,.10)}
  #tabs button[aria-pressed=true]{color:#0a0d16;background:var(--acc);border-color:var(--acc);font-weight:600}
  label.f{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);}
  select,input[type=range]{font-family:var(--sans);font-size:12.5px;}
  select{background:#0c1120;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;}
  input[type=range]{width:150px;accent-color:var(--acc);}
  label.c{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
  #note{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.5;
    flex:1 1 260px;min-width:180px;}
  #note b{color:var(--ink);font-weight:600}
  #note em{font-style:normal;color:var(--gold)}
  #stage{flex:1;min-height:0;position:relative;background:var(--bg);}
  #gl,#ui{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #ui{pointer-events:none}
  #legend{position:absolute;left:12px;bottom:12px;background:rgba(7,10,20,.86);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6;
    backdrop-filter:blur(9px);max-width:min(340px,calc(100vw - 24px));}
  #legend b{color:var(--ink);font-weight:600}
  #legend .t{color:var(--ink);font-family:var(--sans);font-size:12.5px;
    font-weight:600;margin-bottom:4px}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  @media (max-width:720px){
    #tabs button{font-size:11.5px;padding:6px 8px}
    #note{flex-basis:100%}
    input[type=range]{width:110px}
  }
  @media (prefers-reduced-motion: reduce){ #tabs button{transition:none} }
</style>

<div id="app">
  <div id="bar">
    <div id="tabs" role="group" aria-label="Раскладка"></div>
    <label class="f">набор
      <select id="set"></select>
    </label>
    <label class="f">тел <b id="cn" style="color:var(--ink);font-family:var(--mono)">0</b>
      <input id="cnt" type="range" min="5" max="400" value="400" aria-label="Сколько тел показывать">
    </label>
    <label class="c"><input id="acc" type="checkbox" checked> акцент Replay</label>
    <div id="note"></div>
  </div>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ui" aria-hidden="true"></canvas>
    <div id="legend"></div>
  </div>
</div>

/* ============================================================== раскладки
   Каждая получает список тел и радиус поля в пикселях и расставляет x,y.
   Тела приходят отсортированными по объёму, крупные первыми. */
var TAU=6.283185307;
function phyllo(it,R){                     /* спираль Фибоначчи, золотой угол */
  var n=it.length;
  for(var i=0;i<n;i++){ var a=i*2.399963229, rr=R*Math.sqrt((i+0.5)/n);
    it[i].x=Math.cos(a)*rr; it[i].y=Math.sin(a)*rr; }
}
function arms(it,R){                       /* спиральный диск, рукав = группа */
  var g=groups(it), keys=Object.keys(g), A=Math.min(4,Math.max(2,keys.length));
  var buckets=[]; for(var k=0;k<A;k++) buckets.push([]);
  keys.forEach(function(k,i){ var b=buckets[i%A];
    g[k].forEach(function(o){ b.push(o); }); });
  for(var a=0;a<A;a++){ var L=buckets[a], m=L.length;
    for(var i=0;i<m;i++){ var t=(i+0.6)/(m+0.3);
      var th=t*0.85*TAU + a*TAU/A, rr=R*(0.13+0.84*Math.pow(t,0.58));
      L[i].x=Math.cos(th)*rr; L[i].y=Math.sin(th)*rr*0.88; } }
}
function islands(it,R){                    /* острова: группа = отдельное скопление */
  var g=groups(it), keys=Object.keys(g)
      .sort(function(a,b){ return g[b].length-g[a].length; });
  /* Круги групп укладываются по спирали: самый крупный в центре, каждый
     следующий садится в ближайшую свободную точку. Кольцо не годится —
     при полусотне групп они налезают друг на друга. */
  var placed=[], unit=R*0.30;
  keys.forEach(function(k,gi){
    var rad=keys.length===1 ? R*0.94
      : unit*Math.sqrt(g[k].length/Math.max(1,g[keys[0]].length))+R*0.030;
    var px=0, py=0;
    if(gi>0){
      var step=R*0.03, t=0, ok=false;
      for(var s2=1;s2<9000&&!ok;s2++){
        t+=0.42; var rr=step*Math.sqrt(s2)*1.5;
        px=Math.cos(t)*rr; py=Math.sin(t)*rr*0.92;
        ok=true;
        for(var q=0;q<placed.length;q++){
          var o=placed[q], dx=px-o.x, dy=py-o.y;
          if(Math.sqrt(dx*dx+dy*dy) < rad+o.r+R*0.022){ ok=false; break; }
        }
      }
    }
    placed.push({x:px,y:py,r:rad});
    var L=g[k];
    for(var i=0;i<L.length;i++){
      var a=i*2.399963229, rr2=(rad-L[i].r)*Math.sqrt((i+0.5)/L.length);
      L[i].x=px+Math.cos(a)*rr2; L[i].y=py+Math.sin(a)*rr2;
    }
  });
  islands.groups=keys.map(function(k){ return {name:k,list:g[k]}; });
}
function timeline(it,R){                   /* лента времени: x — год выпуска */
  var ys=it.map(function(o){return o.year;}).filter(function(y){return y>0;});
  var lo=ys.length?Math.min.apply(null,ys):0, hi=ys.length?Math.max.apply(null,ys):1;
  if(!(hi>lo)) hi=lo+1;
  var dated=it.filter(function(o){return o.year>0;})
              .sort(function(a,b){return a.year-b.year;});
  var noYear=it.filter(function(o){return !o.year;});
  /* Дорожки: тело садится в самую близкую к оси свободную дорожку, где оно
     не задевает предыдущее. Иначе плотные годы слипаются в столбик. */
  var maxR=0; it.forEach(function(o){ if(o.r>maxR) maxR=o.r; });
  var LS=maxR*2.2+R*0.012;              /* шаг дорожки — по самому крупному телу */
  var endX=[], endR=[];
  dated.forEach(function(o){
    o.x=-R*0.88+((o.year-lo)/(hi-lo))*R*1.76;
    var j=0, LMAX=15;
    for(j=0;j<LMAX;j++){
      if(endX[j]===undefined) break;
      if(o.x-endX[j] > o.r+endR[j]+R*0.010) break;
    }
    if(j>=LMAX){                       /* дорожки кончились — в самую свободную */
      j=0; for(var q2=1;q2<LMAX;q2++) if(endX[q2]<endX[j]) j=q2;
    }
    endX[j]=o.x; endR[j]=o.r;
    var s=Math.ceil((j+1)/2)*((j%2)?-1:1);
    o.y=(j===0?0:s)*LS;
  });
  noYear.forEach(function(o,i){
    o.x=-R*1.06; o.y=(i%9-4)*R*0.095;
  });
  timeline.range=[lo,hi,noYear.length];
}
function force(it,R){                      /* силовая упаковка: тела расталкиваются */
  phyllo(it,R*0.86);
  var n=it.length, iters=n>200?30:90;
  for(var t=0;t<iters;t++){
    for(var i=0;i<n;i++){ var a=it[i];
      for(var j=i+1;j<n;j++){ var b=it[j];
        var dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1e-6;
        var need=(a.r+b.r)*1.34;
        if(d<need){ var f=(need-d)/d*0.5; a.x-=dx*f; a.y-=dy*f; b.x+=dx*f; b.y+=dy*f; } }
      a.x*=0.996; a.y*=0.996;
      var dd=Math.sqrt(a.x*a.x+a.y*a.y), lim=R-a.r;
      if(dd>lim&&dd>0){ var s=lim/dd; a.x*=s; a.y*=s; } }
  }
}
function orbits(it,R){                     /* концентрические кольца — как сейчас */
  var n=it.length;
  if(n===1){ it[0].x=0; it[0].y=0; return; }
  var rings=Math.max(1,Math.round(Math.sqrt(n/1.7))), cap=[], tot=0, r;
  for(r=0;r<rings;r++){ cap[r]=r+1.6; tot+=cap[r]; }
  var idx=0;
  for(r=0;r<rings;r++){
    var cnt=(r===rings-1)?(n-idx):Math.max(1,Math.round(n*cap[r]/tot));
    if(idx+cnt>n) cnt=n-idx;
    var rad=R*(0.20+0.76*((r+1)/rings)), ph=r*1.03;
    for(var i=0;i<cnt;i++){ var a=ph+i*TAU/cnt, o=it[idx++];
      o.x=Math.cos(a)*rad; o.y=Math.sin(a)*rad*0.92; }
    if(idx>=n) break;
  }
  orbits.rings=rings;
}
/* Раскладки считают в своих единицах; здесь результат центрируется и
   вписывается в поле, чтобы кадр не съезжал и не оставлял полей. */
function fitAll(it,R){
  if(!it.length) return;
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  it.forEach(function(o){ x0=Math.min(x0,o.x-o.r); x1=Math.max(x1,o.x+o.r);
    y0=Math.min(y0,o.y-o.r); y1=Math.max(y1,o.y+o.r); });
  var cx=(x0+x1)/2, cy=(y0+y1)/2;
  var k=Math.min(2*R/Math.max(x1-x0,1e-6), 2*R/Math.max(y1-y0,1e-6), 1.35);
  it.forEach(function(o){ o.x=(o.x-cx)*k; o.y=(o.y-cy)*k; o.r*=Math.min(k,1.12); });
}
function groups(it){
  var g={}; it.forEach(function(o){ (g[o.sub]=g[o.sub]||[]).push(o); }); return g;
}

var setEl=document.getElementById('set'), cntEl=document.getElementById('cnt'),

function build(){
  var rows=LAB[curSet], lim=Math.min(+cntEl.value, rows.length);
  cnEl.textContent=lim;
  var maxN=rows[0][1]||1;
  items=rows.slice(0,lim).map(function(r){
    var g=String(r[2]||'—');
    /* У композитора в имени стоят годы жизни — это и есть его место во
       времени. Год первой записи для него ничего не значит. */
    var born=/\((\d{4})/.exec(r[0]);
    return {name:r[0], n:r[1], sub:g, year:born?+born[1]:(r[3]||0), rep:r[4]||0,
            col:PAL[hash(g)%PAL.length], x:0,y:0,r:1};
  });
  var R=Math.max(60,Math.min(W,H)*0.5-46*DPR);
  /* Радиусы: пропорция по объёму, затем общая подгонка под 10 % площади поля,
     чтобы разные раскладки сравнивались при одинаковой «массе». */
  var pw=items.map(function(o){ return Math.pow(o.n/maxN,0.36); });
  var area=pw.reduce(function(s,v){ return s+v*v; },0);
  var k=Math.sqrt(0.10*R*R/Math.max(area,1e-9));
  items.forEach(function(o,i){ o.r=Math.max(1.7*DPR,Math.min(R*0.17,pw[i]*k)); });
  var L=LAYOUTS.filter(function(x){return x.id===curLay;})[0];
  L.fn(items,R);
  fitAll(items,R);
  measure(R);
  legend(L);
}
function measure(R){
  var n=items.length, gap=1e9, over=0;
  for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var a=items[i],b=items[j], dx=b.x-a.x, dy=b.y-a.y;
    var g=Math.sqrt(dx*dx+dy*dy)-a.r-b.r;
    if(g<gap) gap=g;
    if(g<0) over++;
  }
  var ar=items.reduce(function(s,o){ return s+o.r*o.r; },0);
  metrics={gap:n<2?0:gap/DPR, over:over, fill:ar/(R*R)};
}
function legend(L){

  if(curLay==='timeline'&&timeline.range) extra='годы <b>'+timeline.range[0]+'–'+timeline.range[1]+
    '</b>'+(timeline.range[2]?' · без года <b>'+timeline.range[2]+'</b>':'')+' · ';
  if(curLay==='orbits'&&orbits.rings) extra='колец <b>'+orbits.rings+'</b> · ';
  legEl.innerHTML='<div class="t">'+L.name+'</div>'+L.why+
    '<div style="margin-top:7px">'+extra+'тел <b>'+items.length+'</b></div>';
}
function report(){
  var placed=drawLabels.placed||0;
  noteEl.innerHTML='подписей <b>'+placed+' из '+items.length+'</b> · '+
    'минимальный зазор <b>'+metrics.gap.toFixed(1)+' px</b>'+
    (metrics.over?' · <em>перекрытий '+metrics.over+'</em>':'')+
    ' · заполнение <b>'+(metrics.fill*100).toFixed(1)+' %</b>';
}

/* ============================================================== подписи */
function drawLabels(){
  ux.setTransform(1,0,0,1,0,0); ux.clearRect(0,0,W,H); ux.scale(DPR,DPR);
  ux.textAlign='center'; ux.textBaseline='top';
  var VW=W/DPR, VH=H/DPR, cx=VW*0.5, cy=VH*0.5;
  /* Подпись пробуется в восьми положениях вокруг тела и ставится в первое
     свободное. Один якорь «снизу» терял имена даже там, где место было. */
  var ANCH=[[0,1],[0,-1],[1,0],[-1,0],[0.72,0.72],[-0.72,0.72],[0.72,-0.72],[-0.72,-0.72]];
  var order=items.slice().sort(function(a,b){ return b.r-a.r; });
  var placed=[], k=0;
  for(var i=0;i<order.length;i++){
    var o=order[i];
    var fs=Math.max(8.5,Math.min(15,o.r/DPR*0.62+8.5));
    ux.font=(o.rep&&accEl.checked?'600 ':'')+fs.toFixed(1)+'px '+
      'system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    var txt=o.name.length>30?o.name.slice(0,29)+'…':o.name;
    var w=ux.measureText(txt).width, h=fs+3, rr=o.r/DPR+4;
    var px=cx+o.x/DPR, py=cy+o.y/DPR, box=null;
    for(var c=0;c<ANCH.length&&!box;c++){
      var ax=ANCH[c][0], ay=ANCH[c][1];
      var x=px+ax*(rr+w*0.5), y=py+ay*rr+(ay<0?-h-2:2);
      x=Math.max(w/2+3,Math.min(VW-w/2-3,x));
      var b=[x-w/2-4,y-1,x+w/2+4,y+h];
      if(b[1]<2||b[3]>VH-2) continue;
      var ok=true;
      for(var q=0;q<placed.length;q++){ var pb=placed[q];
        if(b[0]<pb[2]&&b[2]>pb[0]&&b[1]<pb[3]&&b[3]>pb[1]){ ok=false; break; } }
      if(ok) box=[b,x,y];
    }
    if(!box) continue;
    placed.push(box[0]); k++;
    ux.fillStyle='rgba(6,9,18,0.55)';
    ux.fillRect(box[0][0],box[0][1],box[0][2]-box[0][0],box[0][3]-box[0][1]);
    ux.fillStyle=(o.rep&&accEl.checked)?'rgba(255,214,140,0.97)':'rgba(233,238,250,0.86)';
    ux.fillText(txt,box[1],box[2]);
  }
  drawLabels.placed=k;
}

/* ============================================================== рендер */
var uW=gl.getUniformLocation(pWeb,'uRes'), uD=gl.getUniformLocation(pDot,'uRes'),
    uT=gl.getUniformLocation(pTone,'uTex'), uE=gl.getUniformLocation(pTone,'uExp');
var EXPO=1.0, TARGET=0.42, RAF=0, dirty=true;
function resize(){
  var w=Math.max(1,stage.clientWidth||window.innerWidth),
      h=Math.max(1,stage.clientHeight||600);
  var nw=Math.round(w*DPR), nh=Math.round(h*DPR);
  if(nw!==W||nh!==H){ W=nw;H=nh; cv.width=W;cv.height=H; uc.width=W;uc.height=H;
    makeFBO(); dirty=true; }
}
function frame(){
  resize();
  if(dirty){ build(); dirty=false; }
  dN=0;
  var cx=W*0.5, cy=H*0.5, light=0;
  for(var i=0;i<items.length;i++){
    var o=items[i], hot=o.rep>0&&accEl.checked;
    var col=hot?GOLD:o.col, a=hot?1.55:1.0, kind=hot?1.0:0.55;
    pushDot(cx+o.x, cy+o.y, o.r, col, a, kind);
    light+=a*Math.min(o.r*o.r*3.1416, W*H)*0.55;
  }
  var est=light/Math.max(W*H,1);
  var want=Math.max(0.18,Math.min(8.0,TARGET/Math.max(est,2e-4)));
  EXPO+=(want-EXPO)*0.14;

  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.viewport(0,0,W,H); gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.useProgram(pWeb); gl.bindVertexArray(vaoQ);
  gl.uniform2f(uW,W,H); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  if(dN){ gl.useProgram(pDot); gl.bindVertexArray(vaoD);
    gl.bindBuffer(gl.ARRAY_BUFFER,dBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,dArr,0,dN*8);
    gl.uniform2f(uD,W,H); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,dN); }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H); gl.disable(gl.BLEND);
  gl.useProgram(pTone); gl.bindVertexArray(vaoQ);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fboT);
  gl.uniform1i(uT,0); gl.uniform1f(uE,EXPO);
  gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null);
  drawLabels(); report();
  RAF=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ if(RAF) cancelAnimationFrame(RAF); RAF=0; }
  else if(!RAF) RAF=requestAnimationFrame(frame);
});

tabsEl.addEventListener('click',function(e){
  var b=e.target.closest('button[data-id]'); if(!b) return;
  curLay=b.dataset.id; dirty=true;
  tabsEl.querySelectorAll('button').forEach(function(x){
    x.setAttribute('aria-pressed', x.dataset.id===curLay?'true':'false'); });
});
setEl.addEventListener('change',function(){ curSet=setEl.value;
  cntEl.max=LAB[curSet].length; cntEl.value=LAB[curSet].length; dirty=true; });
cntEl.addEventListener('input',function(){ dirty=true; });
accEl.addEventListener('change',function(){ dirty=true; });
cntEl.max=LAB[curSet].length; cntEl.value=LAB[curSet].length;

resize();
if(window.ResizeObserver) new ResizeObserver(function(){ dirty=true; resize(); }).observe(stage);
else window.addEventListener('resize',function(){ dirty=true; resize(); });
RAF=requestAnimationFrame(frame);
window.lab=function(){ return {set:curSet,layout:curLay,n:items.length,
  labels:drawLabels.placed,gap:+metrics.gap.toFixed(2),over:metrics.over,
  fill:+(metrics.fill*100).toFixed(1),hdr:HDR,reduce:REDUCE}; };
})();
</script>
