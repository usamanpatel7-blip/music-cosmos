<style>
  :root{
    --bg:#04060d; --ink:#e8ecf7; --dim:#8b93ad; --line:rgba(140,160,220,.18);
    --panel:rgba(7,10,20,.86); --acc:#9a8bff; --gold:#ffc24a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);overscroll-behavior:none;}
  #wrap{position:relative;width:100%;height:100vh;height:100dvh;min-height:360px;
    overflow:hidden;background:var(--bg);}
  #gl,#ui{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #gl{touch-action:none;outline:none;cursor:grab;}
  #ui{pointer-events:none;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  #gl:focus-visible{outline:2px solid var(--acc);outline-offset:-3px;}

  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;backdrop-filter:blur(9px);}

  /* ------------------------------------------------------------- крошки */
  #top{left:14px;top:14px;right:14px;display:flex;gap:10px;align-items:flex-start;
    pointer-events:none;}
  #top .panel{position:static;}
  #crumb{pointer-events:auto;font-family:var(--mono);font-size:11.5px;
    color:var(--dim);display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;
    max-width:min(62vw,720px);}
  #crumb i{color:var(--dim);font-style:normal;opacity:.6}
  #crumb button{font:inherit;color:var(--dim);background:none;border:0;
    padding:2px 5px;border-radius:6px;cursor:pointer;}
  #crumb button:hover{color:var(--ink);background:rgba(154,139,255,.16);}
  #crumb button[aria-current]{color:var(--ink);cursor:default;}
  #crumb button[aria-current]:hover{background:none;}
  #level{margin-left:auto;pointer-events:auto;font-family:var(--mono);
    font-size:11px;color:var(--dim);white-space:nowrap;}
  #level b{color:var(--ink);font-weight:600}
  #metrics{display:none;margin-top:6px;font-family:var(--mono);font-size:10.5px;
    color:var(--dim);line-height:1.5}
  body.debug #metrics{display:block}

  /* -------------------------------------------------------------- карточка */
  #card{right:14px;top:64px;width:300px;font-size:13px;opacity:0;
    transition:opacity .16s;pointer-events:none;max-height:calc(100vh - 150px);
    overflow-y:auto;}
  #card.on{opacity:1;pointer-events:auto;}
  #card .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--acc);margin-bottom:3px;}
  #card .k.hot{color:var(--gold)}
  #card .nm{color:var(--ink);font-size:16px;font-weight:600;line-height:1.3;
    margin-bottom:8px;overflow-wrap:anywhere;}
  #card .row{display:flex;gap:10px;justify-content:space-between;padding:3px 0;
    border-top:1px solid rgba(140,160,220,.10);font-size:12.5px}
  #card .row i{font-style:normal;color:var(--dim);flex:none}
  #card .row u{text-decoration:none;color:var(--ink);text-align:right;
    overflow-wrap:anywhere}
  #card .act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #card a.btn,#card button.btn{font:600 12px/1 var(--sans);color:#0a0d16;
    background:var(--gold);border:0;border-radius:8px;padding:8px 11px;
    text-decoration:none;cursor:pointer;}
  #card button.btn.sec{background:rgba(154,139,255,.18);color:var(--ink);
    border:1px solid var(--line);}
  #card a.btn:hover{filter:brightness(1.08)}
  #card .note{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
    color:var(--dim);font-size:12.5px;line-height:1.5}
  #card .note b{color:var(--ink);display:block;margin-bottom:3px;font-size:13px}

  /* ---------------------------------------------------------------- поиск */
  #find{right:14px;bottom:14px;width:300px;padding:0;overflow:hidden;
    display:flex;flex-direction:column-reverse;}
  #q{width:100%;border:0;outline:0;background:transparent;color:var(--ink);
    font:400 16px var(--sans);padding:11px 13px;}
  #q::placeholder{color:var(--dim)}
  #q:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:11px}
  #res{max-height:min(46vh,320px);overflow-y:auto}
  #res div[role=option]{padding:7px 13px;border-bottom:1px solid rgba(140,160,220,.10);
    cursor:pointer;font-size:12.5px;color:var(--ink);line-height:1.35}
  #res div[role=option]:hover,#res div[role=option].sel{background:rgba(154,139,255,.18)}
  #res div s{display:block;text-decoration:none;color:var(--dim);
    font-family:var(--mono);font-size:10.5px}
  #res .none{padding:9px 13px;color:var(--dim);font-family:var(--mono);font-size:11px}

  #keys{left:14px;bottom:14px;font-family:var(--mono);font-size:11px;
    color:var(--dim);pointer-events:none;}
  .touch-only{display:none}

  /* ---------------------------------------------------------------- чтение */
  #read{position:absolute;inset:0;background:linear-gradient(180deg,
      rgba(4,6,13,.88),rgba(4,6,13,.97) 22%);backdrop-filter:blur(14px);
    overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .28s;z-index:9;}
  #read.on{opacity:1;visibility:visible;}
  #read .inner{max-width:640px;margin:0 auto;padding:64px 24px 96px;}
  #read h1{font-size:clamp(24px,4.2vw,36px);line-height:1.12;margin:0 0 6px;
    font-weight:600;letter-spacing:-.02em;}
  #read .sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--acc);margin:0 0 26px;}
  #read p{font-size:16px;line-height:1.68;color:#cfd6e6;margin:0 0 18px;}
  #read .close{position:sticky;top:0;float:right;font:600 12px var(--sans);
    color:var(--ink);background:rgba(154,139,255,.18);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;cursor:pointer;}

  #nogl{position:absolute;inset:0;overflow-y:auto;padding:28px 20px 40px;}
  #nogl .in{max-width:720px;margin:0 auto}
  #nogl h1{font-size:22px;margin:0 0 6px;font-weight:600}
  #nogl p{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 22px}
  #nogl ol{margin:0;padding:0;list-style:none;display:grid;gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  #nogl li{background:#080c17;padding:9px 13px;display:flex;
    justify-content:space-between;gap:14px;font-size:13.5px}
  #nogl li span{color:var(--dim);font-family:var(--mono);font-size:11.5px;flex:none}

  @media (max-width:760px), (pointer:coarse){
    .touch-only{display:inline} .mouse-only{display:none}
  }
  @media (max-width:760px){
    #top{left:10px;right:10px;top:10px;flex-direction:column;gap:4px}
    #crumb{max-width:none}
    #level{margin-left:0}
    #card{left:10px;right:10px;top:auto;bottom:112px;width:auto;max-height:42vh}
    #find{left:10px;right:10px;bottom:10px;width:auto}
    #keys{left:10px;right:10px;bottom:64px;font-size:10.5px}
    body.used #keys{display:none}
    body.used #card{bottom:64px}
    #read .inner{padding:52px 18px 80px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important} }
</style>

</div>

  var k=Math.min(2*R/Math.max(x1-x0,1e-6),2*R/Math.max(y1-y0,1e-6),1.35);
  it.forEach(function(o){ o.x=(o.x-cx)*k; o.y=(o.y-cy)*k; o.r*=Math.min(k,1.12); });
}
/* Число тел задаёт кандидатов, но выбор делается замером: побеждает та
   раскладка, что поставила больше подписей. При равенстве — рукава. */
function layout(node, R){
  var ch=node.ch, n=ch.length;
  var maxN=1; ch.forEach(function(c){ if(c.n>maxN) maxN=c.n; });
  var items=ch.map(function(c){
    return {node:c, name:c.name, r:1, x:0, y:0,
            grp:(c.ch[0]&&c.ch[0].kind)||c.kind};
  });
  var pw=items.map(function(o,i){ return Math.pow(ch[i].n/maxN,0.36); });
  var area=pw.reduce(function(s,v){ return s+v*v; },0);
  var k=Math.sqrt(0.105*R*R/Math.max(area,1e-9));
  items.forEach(function(o,i){ o.r=Math.max(2.0*DPR,Math.min(R*0.18,pw[i]*k)); });

  /* Рукава — выбранный владельцем вид, поэтому они пробуются первыми и
     берутся сразу, как только подписали всё. Уступают они только там, где
     реально теряют имена: читаемость важнее вида. На двух-шести телах
     спираль не читается спиралью, там сразу кольца. */
  /* насколько длинны подписи по сравнению с телами — от этого зависит,
     как сильно разносить их вдоль рукава */
  ux.font='12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  var wsum=0, dsum=0;
  items.forEach(function(o){ wsum+=ux.measureText(o.name.slice(0,34)).width*DPR;
    dsum+=o.r*2; });
  var spread=Math.max(1,Math.min(3.2,(wsum/n)/Math.max(dsum/n,1)*0.42));
  var cands = n<=6   ? [['кольца',orbits]]
            : n<=140 ? [['рукава',arms],['кольца',orbits],['спираль',phyllo]]
                     : [['спираль',phyllo],['рукава',arms],['кольца',orbits]];
  var best=null, bestK=-1, saved=null, scores=[], r0=items.map(function(o){return o.r;});
  for(var c=0;c<cands.length;c++){
    items.forEach(function(o,i){ o.r=r0[i]; delete o.lx; delete o.ly; });
    cands[c][1](items,R,spread);
    deoverlap(items,R);
    fitAll(items,R);
    var got=placeLabels(items,true);
    scores.push(cands[c][0]+' '+got);
    if(got>bestK){
      bestK=got; best=cands[c][0];
      saved=items.map(function(o){ return [o.x,o.y,o.r,o.lx,o.ly]; });
    }
    if(got>=n) break;                    /* все подписи — дальше искать нечего */
  }
  items.forEach(function(o,i){
    o.x=saved[i][0]; o.y=saved[i][1]; o.r=saved[i][2];
    if(saved[i][3]===undefined){ delete o.lx; delete o.ly; }
    else { o.lx=saved[i][3]; o.ly=saved[i][4]; }
  });
  return {items:items, pick:best, labels:bestK, scores:scores, R:R};
}

/* ================================================================= подписи
   Подпись пробуется в подсказанном раскладкой направлении, затем в восьми
   вокруг тела. Уровень считается удавшимся, если поставлены все. */
var ANCH=[[0,1],[0,-1],[1,0],[-1,0],[0.72,0.72],[-0.72,0.72],[0.72,-0.72],[-0.72,-0.72]];
function placeLabels(items, dry, alpha, ox, oy, sc){
  sc=sc||1; ox=ox||0; oy=oy||0;
  var VW=W/DPR, VH=H/DPR, cx=VW*0.5, cy=VH*0.5;
  var order=items.slice().sort(function(a,b){ return b.r-a.r; });
  var placed=[], k=0;
  for(var i=0;i<order.length;i++){
    var o=order[i], nd=o.node;
    var hot = nd ? (nd.kind==='track' ? nd.hot>0
                    : (nd.hot/Math.max(nd.n,1))>0.34) : false;
    var rr=o.r*sc/DPR;
    var fs=Math.max(9,Math.min(15.5,rr*0.60+9));
    ux.font=(hot?'600 ':'')+fs.toFixed(1)+'px '+
      'system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    var txt=o.name.length>34?o.name.slice(0,33)+'…':o.name;
    var w=ux.measureText(txt).width, h=fs+3, pad=rr+5;
    var px=cx+(o.x*sc+ox)/DPR, py=cy+(o.y*sc+oy)/DPR, box=null;
    var anch=(o.lx!==undefined)?[[o.lx,o.ly],[-o.lx,-o.ly]].concat(ANCH):ANCH;
    /* Кроме восьми сторон пробуются три расстояния: на спирали вдоль хребта
       тесно, а radially место обычно есть, и длинное имя туда уходит. */
    var DIST=[1,1.7,2.5];
    for(var c=0;c<anch.length&&!box;c++){
      for(var dd=0;dd<DIST.length&&!box;dd++){
        var ax=anch[c][0], ay=anch[c][1], gap=pad*DIST[dd];
        var x=px+ax*(gap+w*0.5), y=py+ay*gap+(ay<0?-h-2:2);
        x=Math.max(w/2+4,Math.min(VW-w/2-4,x));
        var b=[x-w/2-4,y-1,x+w/2+4,y+h];
        if(b[1]<2||b[3]>VH-2) continue;
        var ok=true;
        for(var q=0;q<placed.length;q++){ var pb=placed[q];
          if(b[0]<pb[2]&&b[2]>pb[0]&&b[1]<pb[3]&&b[3]>pb[1]){ ok=false; break; } }
        if(ok) box=[b,x,y];
      }
    }
    if(!box) continue;
    placed.push(box[0]); k++;
    if(dry) continue;
    var a=Math.min(1,alpha===undefined?1:alpha);
    ux.fillStyle='rgba(6,9,18,'+(0.55*a).toFixed(3)+')';
    ux.fillRect(box[0][0],box[0][1],box[0][2]-box[0][0],box[0][3]-box[0][1]);
    ux.fillStyle=hot?'rgba(255,214,140,'+(0.97*a).toFixed(3)+')'
                    :'rgba(233,238,250,'+(0.88*a).toFixed(3)+')';
    ux.fillText(txt,box[1],box[2]);
  }
  return k;
}

/* ================================================================== шейдеры */
function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
function pr(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));return p;}
var H1='#version 300 es\nprecision highp float;\n';
var FS3='out vec2 vP; const vec2 q[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));\
void main(){ vP=q[gl_VertexID]; gl_Position=vec4(q[gl_VertexID],0,1);} ';
var pWeb,pDot,pTone,quad,dBuf,vaoD,vaoQ,fbo,fboT,HDR;
var MAXD=6000, dArr=new Float32Array(MAXD*8), dN=0;

function initGL(){
  pWeb=pr(H1+FS3,
  H1+'in vec2 vP; out vec4 o; uniform vec2 uRes; uniform vec2 uPan;\
  float h1(vec2 p){return fract(sin(dot(p,vec2(41.7,289.3)))*43758.545);}\
  float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);\
   float a=h1(i),b=h1(i+vec2(1,0)),c=h1(i+vec2(0,1)),d=h1(i+vec2(1,1));\
   return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}\
  float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<3;i++){v+=a*vn(p);p*=2.03;a*=0.5;}return v;}\
  float stars(vec2 p,float thr){vec2 i=floor(p);float r=h1(i);\
   if(r<thr)return 0.0; vec2 c=i+vec2(h1(i+7.1),h1(i+3.3))*0.7+0.15;\
   float d=length(p-c); return exp(-d*d*36.0)*(0.35+0.65*fract(r*17.0));}\
  void main(){ vec2 w=((vP*0.5+0.5)*uRes+uPan)/300.0;\
   vec2 q=vec2(fbm(w*1.4),fbm(w*1.4+vec2(4.7,1.9)));\
   float n=fbm(w*2.4+2.3*q); float v=pow(smoothstep(0.30,0.92,n),1.7)*0.075;\
   vec3 c=mix(vec3(0.14,0.16,0.40),vec3(0.42,0.26,0.62),smoothstep(0.0,0.05,v));\
   c=mix(c,vec3(0.60,0.38,0.48),smoothstep(0.035,0.075,v)*0.55);\
   vec3 col=c*v;\
   col+=vec3(0.72,0.78,1.00)*stars(w*12.0,0.985)*0.055;\
   col+=vec3(1.00,0.88,0.76)*stars(w*5.2+19.3,0.978)*0.030;\
   o=vec4(col,1.0);}');

  pDot=pr(H1+'layout(location=0) in vec2 aQ; layout(location=1) in vec2 aPos;\
  layout(location=2) in float aR; layout(location=3) in vec3 aC; layout(location=4) in float aA;\
  layout(location=5) in float aK; uniform vec2 uRes; out vec2 vQ; out vec3 vC; out float vA; out float vK;\
  void main(){ vQ=aQ; vC=aC; vA=aA; vK=aK; vec2 p=aPos+aQ*aR*2.05;\
   gl_Position=vec4(p/uRes*2.0-1.0,0,1); gl_Position.y=-gl_Position.y; }',
  H1+'in vec2 vQ; in vec3 vC; in float vA; in float vK; out vec4 o;\
  void main(){ float r2=dot(vQ,vQ)*4.2; if(r2>4.2) discard;\
   if(vK<0.0){ o=vec4(vC*exp(-r2*0.55)*smoothstep(4.2,1.8,r2)*0.135*vA,1.0); return; }\
   float halo=exp(-r2*(1.10+vK*1.5))*0.095;\
   float body=exp(-r2*(2.60+vK*2.0))*0.150;\
   float core=exp(-r2*(6.00+vK*10.0))*(0.72+vK*0.45);\
   float v=halo+body+core;\
   if(vK>0.95){ float sx=exp(-abs(vQ.x)*13.0-vQ.y*vQ.y*120.0);\
     float sy=exp(-abs(vQ.y)*13.0-vQ.x*vQ.x*120.0); v+=(sx+sy)*0.16; }\
   vec3 c=mix(vC,vec3(1.00,0.95,0.88),clamp(core*0.85,0.0,0.72));\
   o=vec4(c*v*vA,1.0); }');

  pTone=pr(H1+FS3,
  H1+'in vec2 vP; out vec4 o; uniform sampler2D uTex; uniform float uExp;\
  void main(){ vec2 uv=vP*0.5+0.5; vec2 d=uv-0.5; float r2=dot(d,d);\
   float ab=0.0030*r2;\
   vec3 c=vec3(texture(uTex,uv+d*ab).r,texture(uTex,uv).g,texture(uTex,uv-d*ab).b);\
   c*=uExp;\
   float L=dot(c,vec3(0.2126,0.7152,0.0722));\
   if(L>1e-5){ float Ln=L/(1.0+L); c*=Ln/L;\
     c=mix(c,vec3(Ln),clamp(L*0.045-0.30,0.0,0.50)); }\
   c=pow(clamp(c,0.0,1.0),vec3(0.92));\
   c*=1.0-0.46*smoothstep(0.045,0.50,r2);\
   float g=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.545);\
   c+=(g-0.5)*0.020;\
   o=vec4(clamp(c,0.0,1.0),1.0); }');

  quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  dBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,dBuf);
  gl.bufferData(gl.ARRAY_BUFFER,dArr.byteLength,gl.DYNAMIC_DRAW);
  vaoD=gl.createVertexArray(); gl.bindVertexArray(vaoD);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,dBuf);
  [[1,2,0],[2,1,8],[3,3,12],[4,1,24],[5,1,28]].forEach(function(a){
    gl.enableVertexAttribArray(a[0]);
    gl.vertexAttribPointer(a[0],a[1],gl.FLOAT,false,32,a[2]);
    gl.vertexAttribDivisor(a[0],1); });
  gl.bindVertexArray(null);
  vaoQ=gl.createVertexArray(); gl.bindVertexArray(vaoQ);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); gl.bindVertexArray(null);
  HDR=!!gl.getExtension('EXT_color_buffer_float');
}
function makeFBO(){
  if(fboT){ gl.deleteTexture(fboT); gl.deleteFramebuffer(fbo); }
  fboT=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,fboT);
  gl.texStorage2D(gl.TEXTURE_2D,1,HDR?gl.RGBA16F:gl.RGBA8,W,H);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fboT,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function pushDot(x,y,r,c,a,k){ if(dN>=MAXD)return; var o=dN*8;
  dArr[o]=x;dArr[o+1]=y;dArr[o+2]=r;dArr[o+3]=c[0];dArr[o+4]=c[1];dArr[o+5]=c[2];
  dArr[o+6]=a;dArr[o+7]=k; dN++; }

/* =================================================================== уровни
   Уровень дискретный: на экране дети текущего узла и только они. Внуки —
   крупой без подписей, чтобы было видно, что внутри что-то есть. Переход
   между уровнями — короткий полёт, а не постоянная смесь трёх поколений. */
var cur=ROOT, lay=null, trans=null, sel=null, hover=null, zoom=1, RAF=0;
var elCrumb=document.getElementById('crumb'), elLevel=document.getElementById('level'),
    elCard=document.getElementById('card'), elMetr=document.getElementById('metrics'),
    elRead=document.getElementById('read');

function fieldR(){ return Math.max(80, Math.min(W,H)*0.5 - 74*DPR); }
function relayout(){ lay = cur.ch.length ? layout(cur, fieldR()) : {items:[],pick:'—',labels:0}; }
function ease(t){ return t*t*(3-2*t); }

function find(node){
  if(!lay) return null;
  for(var i=0;i<lay.items.length;i++) if(lay.items[i].node===node) return lay.items[i];
  return null;
}
function enter(node){
  if(!node||!node.ch.length){ select(node); return; }
  var it=find(node);
  var A=lay, focus=it?{x:it.x,y:it.y}:{x:0,y:0};
  var S=it?Math.max(2.2,Math.min(7,fieldR()/Math.max(it.r,1))):3;
  cur=node; sel=null; hover=null; relayout();
  trans={A:A,B:lay,focus:focus,S:S,dir:1,t0:performance.now(),
         dur:REDUCE?160:620};
  card(node); refreshChrome();
}
function up(){
  if(!cur.parent) return;
  var child=cur, B=lay;
  cur=cur.parent; sel=child; hover=null; relayout();
  var it=find(child), focus=it?{x:it.x,y:it.y}:{x:0,y:0};
  var S=it?Math.max(2.2,Math.min(7,fieldR()/Math.max(it.r,1))):3;
  trans={A:lay,B:B,focus:focus,S:S,dir:-1,t0:performance.now(),
         dur:REDUCE?160:620};
  card(sel); refreshChrome();
}
function goTo(node){                        /* из поиска: встать так, чтобы объект был виден */
  var path=ancestors(node);
  cur = node.ch.length ? node : (node.parent||ROOT);
  sel = node.ch.length ? null : node;
  trans=null; zoom=1; relayout(); card(node); refreshChrome();
}
function select(node){ sel=node; card(node); }

function refreshChrome(){
  var path=ancestors(cur), h='<button type="button" data-i="-1">Музыка</button>';
  for(var i=0;i<path.length;i++)
    h+='<i>›</i><button type="button" data-i="'+i+'"'+
       (i===path.length-1?' aria-current="true"':'')+'>'+esc(path[i].name)+'</button>';
  elCrumb.innerHTML=h;
  var LV={root:'разделы',realm:'жанры и эпохи',genre:'направления',sub:'авторы',
          split:'авторы',artist:'альбомы и произведения',album:'треки',work:'треки'};
  elLevel.innerHTML= cur.ch.length
    ? '<b>'+cur.ch.length+'</b> '+(LV[cur.kind]||'объектов')+' · <b>'+cur.n+'</b> треков'
    : '<b>'+cur.n+'</b> треков';
}
elCrumb.addEventListener('click',function(e){
  var b=e.target.closest('button[data-i]'); if(!b) return;
  var i=+b.dataset.i, path=ancestors(cur);
  var target = i<0 ? ROOT : path[i];
  if(target===cur) return;
  var steps=0;
  while(cur!==target&&cur.parent&&steps++<12) up();
});

/* =================================================================== рендер */
var EXPO=1.0, TARGET=0.42, uW,uPan,uD,uT,uE, panX=0, panY=0;
function draw(now){
  var st;
  if(trans){
    var e=ease(Math.min(1,(now-trans.t0)/trans.dur));
    var k = trans.dir>0 ? 1+(trans.S-1)*e : trans.S+(1-trans.S)*e;
    st=[{lay:trans.A,k:k,ox:-trans.focus.x*k,oy:-trans.focus.y*k,
         a:trans.dir>0?1-e:e},
        {lay:trans.B,k:k/trans.S,ox:0,oy:0,a:trans.dir>0?e:1-e}];
    if(e>=1){ lay = trans.dir>0?trans.B:trans.A; trans=null; }
  } else {
    st=[{lay:lay,k:1,ox:0,oy:0,a:1}];
  }
  dN=0;
  var cx=W*0.5, cy=H*0.5, light=0;
  for(var s=0;s<st.length;s++){
    var L=st[s]; if(!L.lay||L.a<=0.004) continue;
    var sc=L.k*zoom, ox=L.ox*zoom, oy=L.oy*zoom;
    /* граница того, внутри чего мы находимся — тонкий контур, держит место */
    var items=L.lay.items;
    for(var i=0;i<items.length;i++){
      var o=items[i], nd=o.node;
      var x=cx+o.x*sc+ox, y=cy+o.y*sc+oy, r=o.r*sc;
      if(x+r*3<0||x-r*3>W||y+r*3<0||y-r*3>H) continue;
      /* Акцент пропорционален доле чартовых треков, а не факту «есть хоть
         один»: почти у каждого жанра он есть, и от этого золотом светилось
         всё подряд. Лучи и полный золотой цвет достаются только трекам. */
      var isTrack=nd.kind==='track';
      var share=isTrack?(nd.hot?1:0):Math.min(1,(nd.hot/Math.max(nd.n,1))*1.7);
      var hot=isTrack?nd.hot>0:share>0.34;
      var isSel=(nd===sel||nd===hover);
      var a=L.a*(isSel?1.55:1.0)*(1+0.30*share);
      var col=share<=0.01?nd.col:[
        nd.col[0]+(GOLD[0]-nd.col[0])*share,
        nd.col[1]+(GOLD[1]-nd.col[1])*share,
        nd.col[2]+(GOLD[2]-nd.col[2])*share];
      var kind=(isTrack&&nd.hot)?1.0:0.55;
      /* газ территории под крупными телами — подложка без края */
      if(nd.ch.length&&r>10) pushDot(x,y,r*2.0,nd.col,a*0.34,-1.0);
      pushDot(x,y,Math.max(1.4,r),col,a,kind);
      light+=a*Math.min(r*r*3.1416,W*H)*0.55;
      /* внуки — крупой, без подписей: видно, что внутри что-то есть */
      var m=nd.ch.length;
      if(m&&r>13){
        var dust=Math.min(m,26), da=L.a*0.5*Math.min(1,(r-13)/26);
        for(var d=0;d<dust;d++){
          var ang=d*2.399963229, dr=r*0.66*Math.sqrt((d+0.5)/dust);
          pushDot(x+Math.cos(ang)*dr, y+Math.sin(ang)*dr,
                  Math.max(0.9,r*0.055), nd.col, da, 0.9);
        }
      }
    }
  }
  var est=light/Math.max(W*H,1);
  var want=Math.max(0.18,Math.min(8.0,TARGET/Math.max(est,2e-4)));
  EXPO+=(want-EXPO)*0.12;

  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.viewport(0,0,W,H); gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.useProgram(pWeb); gl.bindVertexArray(vaoQ);
  gl.uniform2f(uW,W,H); gl.uniform2f(uPan,panX,panY);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  if(dN){ gl.useProgram(pDot); gl.bindVertexArray(vaoD);
    gl.bindBuffer(gl.ARRAY_BUFFER,dBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,dArr,0,dN*8);
    gl.uniform2f(uD,W,H); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,dN); }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H); gl.disable(gl.BLEND);
  gl.useProgram(pTone); gl.bindVertexArray(vaoQ);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fboT);
  gl.uniform1i(uT,0); gl.uniform1f(uE,EXPO);
  gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null);

  ux.setTransform(1,0,0,1,0,0); ux.clearRect(0,0,W,H); ux.scale(DPR,DPR);
  ux.textAlign='center'; ux.textBaseline='top';
  var shown=0;
  for(var s2=0;s2<st.length;s2++){
    var L2=st[s2]; if(!L2.lay||L2.a<0.12) continue;
    shown=placeLabels(L2.lay.items,false,L2.a,L2.ox*zoom,L2.oy*zoom,L2.k*zoom);
  }
  if(DEBUG&&lay) elMetr.innerHTML='раскладка <b style="color:#e8ecf7">'+lay.pick+
    '</b> · тел '+lay.items.length+' · подписей '+lay.labels+'/'+lay.items.length+
    ' · точек '+dN;
  return shown;
}
function frame(now){
  RAF=requestAnimationFrame(frame);
  draw(now);
}

/* ================================================================= карточка */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var LVNAME={realm:'раздел',genre:'жанр · эпоха',sub:'направление · субжанр',
  split:'группа',artist:'автор',album:'альбом',work:'произведение',track:'трек'};
function years(o){
  var lo=1e9,hi=0;
  (function walk(x){ if(x.kind==='track'){ if(x.raw[5]){ lo=Math.min(lo,x.raw[5]);
      hi=Math.max(hi,x.raw[5]); } } else x.ch.forEach(walk); })(o);
  return hi?(lo===hi?String(lo):lo+'–'+hi):null;
}
function agesOf(o){
  var m=0;
  (function walk(x){ if(x.kind==='track') m|=x.raw[8]; else x.ch.forEach(walk); })(o);
  return DATA.ages.filter(function(a,k){ return m&(1<<k); });
}
function card(o){
  if(!o){ elCard.classList.remove('on'); return; }
  var hot=o.hot>0;
  var h='<div class="k'+(hot?' hot':'')+'">'+(LVNAME[o.kind]||'объект')+
        (hot?' · в чартах Replay':'')+'</div><div class="nm">'+esc(o.name)+'</div>';
  function row(k,v){ if(v===null||v===undefined||v==='') return;
    h+='<div class="row"><i>'+k+'</i><u>'+esc(v)+'</u></div>'; }
  if(o.kind==='track'){
    var alb=albumOf(o), art=artistOf(o);
    row('автор', art?art.name:null);
    row(alb&&alb.kind==='work'?'произведение':'альбом', alb?alb.name:null);
    row('год', o.raw[5]||null);
    if(o.raw[6]>0) row('Replay','место '+o.raw[6]+(o.raw[7]>1?', периодов '+o.raw[7]:''));
    var ag=DATA.ages.filter(function(a,k){ return o.raw[8]&(1<<k); });
    if(ag.length) row('слушалось', ag.join(', '));
  } else {
    row('треков', o.n);
    if(o.ch.length) row(o.kind==='artist'?'альбомов и произведений':'внутри', o.ch.length);
    if(o.kind==='genre'&&o.raw[4]) row('с', o.raw[4]+' года');
    var y=years(o); if(y) row('годы', y);
    if(hot) row('в чартах Replay', o.hot+' треков');
    if(o.kind!=='realm'){ var ag2=agesOf(o); if(ag2.length&&ag2.length<5) row('слушалось', ag2.join(', ')); }
  }
  var acts=[];
  if(o.kind==='track'){
    var u=appleUrl(o);
    if(u) acts.push('<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Слушать в Apple Music</a>');
  } else if(o.ch.length){
    acts.push('<button class="btn sec" data-act="enter">Открыть</button>');
  }
  if(NOTES[o.i]!==undefined) acts.push('<button class="btn sec" data-act="read">Читать заметку</button>');
  if(acts.length) h+='<div class="act">'+acts.join('')+'</div>';
  if(NOTES[o.i]!==undefined){
    var first=NOTES[o.i].split('\n').filter(function(x){return x.trim();});
    h+='<div class="note"><b>'+esc(first[0]||'')+'</b>'+esc((first[1]||'').slice(0,150))+'…</div>';
  }
  elCard.innerHTML=h; elCard.classList.add('on'); elCard._node=o;
}
elCard.addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]'); if(!b||!elCard._node) return;
  if(b.dataset.act==='enter') enter(elCard._node);
  if(b.dataset.act==='read') openNote(elCard._node);
});

/* ================================================================== чтение
   Переход «объект → текст» взят из прототипа нырка: карта уходит назад,
   страница занимает экран. */
function openNote(o){
  var txt=NOTES[o.i]; if(txt===undefined) return;
  var lines=txt.split('\n');
  var title=lines.shift().trim();
  var body=lines.join('\n').split(/\n\s*\n/).filter(function(p){return p.trim();});
  elRead.innerHTML='<div class="inner"><button class="close" type="button">Закрыть</button>'+
    '<div class="sub">'+esc(LVNAME[o.kind]||'')+'</div>'+
    '<h1>'+esc(title)+'</h1>'+
    body.map(function(p){ return '<p>'+esc(p.trim())+'</p>'; }).join('')+'</div>';
  elRead.classList.add('on');
  elRead.querySelector('.close').focus();
}
function closeNote(){ elRead.classList.remove('on'); cv.focus(); }
elRead.addEventListener('click',function(e){
  if(e.target.closest('.close')||e.target===elRead) closeNote();
});

/* ==================================================================== поиск */
function norm(t){
  t=String(t).toLowerCase().replace(/ё/g,'е');
  if(t.normalize) t=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return t.replace(/\s+/g,' ').trim();
}
var LAYEN="qwertyuiop[]asdfghjkl;'zxcvbnm,./`", LAYRU="йцукенгшщзхъфывапролджэячсмитьбю.ё";
function swapLayout(t){ var o='',k;
  for(var i=0;i<t.length;i++){ k=LAYEN.indexOf(t[i]); o+=(k>=0?LAYRU[k]:t[i]); }
  return norm(o); }
var INDEX=NODES.filter(function(o){ return o.kind!=='split'; })
  .map(function(o){ return [norm(o.name),o]; });
var qEl=document.getElementById('q'), rEl=document.getElementById('res');
var hits=[], cursor=-1;
function lookup(q){
  var out=[], i, k;
  for(i=0;i<INDEX.length;i++){
    k=INDEX[i][0].indexOf(q);
    if(k===0) out.push([INDEX[i][1],0]);
    else if(k>0) out.push([INDEX[i][1], INDEX[i][0].charAt(k-1)===' '?1:2]);
    if(out.length>=600) break;
  }
  var ord={realm:0,genre:1,sub:2,artist:3,album:4,work:4,track:5};
  out.sort(function(a,b){
    if(a[1]!==b[1]) return a[1]-b[1];
    var oa=ord[a[0].kind], ob=ord[b[0].kind];
    if(oa!==ob) return oa-ob;
    return b[0].n-a[0].n;
  });
  return out.slice(0,8).map(function(x){ return x[0]; });
}
function drawRes(){
  if(!hits.length){ rEl.innerHTML='<div class="none">ничего не найдено</div>';
    qEl.setAttribute('aria-expanded','false'); return; }
  rEl.innerHTML=hits.map(function(o,k){
    var p=o.parent&&o.parent!==ROOT?o.parent.name:'';
    return '<div role="option" id="opt'+k+'" data-k="'+k+'"'+
      (k===cursor?' class="sel" aria-selected="true"':' aria-selected="false"')+'>'+
      esc(o.name.slice(0,54))+'<s>'+esc(LVNAME[o.kind]||'')+(p?' · '+esc(p):'')+'</s></div>';
  }).join('');
  qEl.setAttribute('aria-expanded','true');
}
function closeRes(){ hits=[]; cursor=-1; rEl.innerHTML='';
  qEl.setAttribute('aria-expanded','false'); }
function choose(k){ var o=hits[k]; if(!o) return;
  goTo(o); closeRes(); qEl.value=''; qEl.blur(); cv.focus(); }
qEl.addEventListener('input',function(){
  var q=norm(qEl.value);
  if(q.length<2){ closeRes(); return; }
  hits=lookup(q);
  if(!hits.length){ var alt=swapLayout(q); if(alt!==q&&alt.length>1) hits=lookup(alt); }
  cursor=-1; drawRes();
});
qEl.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!hits.length) return; e.preventDefault();
    if(e.key==='ArrowDown') cursor=(cursor+1>=hits.length)?0:cursor+1;
    else cursor=(cursor<=0)?hits.length-1:cursor-1;
    qEl.setAttribute('aria-activedescendant','opt'+cursor); drawRes(); return;
  }
  if(e.key==='Enter'){ e.preventDefault(); choose(cursor<0?0:cursor); return; }
  if(e.key==='Escape'){ e.stopPropagation();
    if(rEl.innerHTML) closeRes(); else { qEl.value=''; qEl.blur(); cv.focus(); } }
});
rEl.addEventListener('click',function(e){
  var d=e.target.closest('div[data-k]'); if(d) choose(+d.dataset.k);
});

/* ==================================================================== ввод */
function mouse(e){ var r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*DPR,(e.clientY-r.top)*DPR]; }
function hitAt(m){
  if(!lay||trans) return null;
  var cx=W*0.5, cy=H*0.5, best=null, bd=1e9;
  for(var i=0;i<lay.items.length;i++){
    var o=lay.items[i], dx=cx+o.x*zoom-m[0], dy=cy+o.y*zoom-m[1];
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<Math.max(o.r*zoom,16*DPR)&&d<bd){ bd=d; best=o.node; }
  }
  return best;
}
var pts={}, npts=0, drag=null, moved=0, pinch=null, lastTap=0, lastPos=null;
function pinchNow(){
  var k=Object.keys(pts); if(k.length<2) return null;
  var a=pts[k[0]], b=pts[k[1]];
  return {d:Math.max(1,Math.sqrt((b[0]-a[0])*(b[0]-a[0])+(b[1]-a[1])*(b[1]-a[1])))};
}
function setZoom(z){ zoom=Math.max(0.72,Math.min(2.4,z)); }
cv.addEventListener('wheel',function(e){ e.preventDefault();
  setZoom(zoom*Math.exp(-e.deltaY*0.0011)); },{passive:false});
cv.addEventListener('pointerdown',function(e){
  document.body.classList.add('used');
  cv.setPointerCapture(e.pointerId);
  if(!pts[e.pointerId]) npts++;
  pts[e.pointerId]=mouse(e); lastPos=pts[e.pointerId];
  if(npts>=2){ drag=null; pinch=pinchNow(); }
  else { drag=lastPos; moved=0; }
});
cv.addEventListener('pointermove',function(e){
  var m=mouse(e);
  if(pts[e.pointerId]){ pts[e.pointerId]=m; lastPos=m; }
  if(npts>=2){ var st=pinchNow();
    if(st&&pinch){ setZoom(zoom*st.d/pinch.d); moved+=Math.abs(st.d-pinch.d); }
    pinch=st; return; }
  if(drag){ moved+=Math.abs(m[0]-drag[0])+Math.abs(m[1]-drag[1]); drag=m; return; }
  var best=hitAt(m);
  if(best!==hover){ hover=best; card(best||sel); }
  cv.style.cursor=best?'pointer':'grab';
});
function endPointer(e){
  if(pts[e.pointerId]){ delete pts[e.pointerId]; npts=Math.max(0,npts-1); }
  if(npts<2) pinch=null;
  if(npts===0){
    var wasDrag=drag; drag=null;
    if(wasDrag&&moved<9*DPR&&lastPos){
      var now=performance.now();
      if(now-lastTap<320){ lastTap=0; up(); return; }
      lastTap=now;
      var n=hitAt(lastPos);
      if(n){ hover=n; if(n.ch.length) enter(n); else select(n); }
    }
  } else { var k=Object.keys(pts); drag=pts[k[0]]; }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);

function nearest(node,dx,dy){
  var it=find(node); if(!it||!lay) return null;
  var best=null,bs=1e18;
  for(var i=0;i<lay.items.length;i++){
    var o=lay.items[i]; if(o.node===node) continue;
    var vx=o.x-it.x, vy=o.y-it.y, d=Math.sqrt(vx*vx+vy*vy)||1e-9;
    var dot=(vx*dx+vy*dy)/d;
    if(dot<0.34) continue;
    var sc=d/(0.34+dot);
    if(sc<bs){ bs=sc; best=o.node; }
  }
  return best;
}
window.addEventListener('keydown',function(e){
  if(document.activeElement===qEl) return;
  if(elRead.classList.contains('on')){ if(e.key==='Escape') closeNote(); return; }
  if(e.key==='/'){ e.preventDefault(); qEl.focus(); return; }
  if(e.key==='Escape'||e.key==='Backspace'){ e.preventDefault(); up(); return; }
  if(e.key==='Enter'){ e.preventDefault();
    if(sel&&sel.ch.length) enter(sel);
    else if(lay&&lay.items.length){ var b=lay.items[0];
      for(var i=1;i<lay.items.length;i++) if(lay.items[i].node.n>b.node.n) b=lay.items[i];
      if(b.node.ch.length) enter(b.node); else select(b.node); }
    return; }
  var d=null;
  if(e.key==='ArrowLeft') d=[-1,0]; else if(e.key==='ArrowRight') d=[1,0];
  else if(e.key==='ArrowUp') d=[0,-1]; else if(e.key==='ArrowDown') d=[0,1];
  if(!d) return;
  e.preventDefault();
  if(!lay||!lay.items.length) return;
  if(!sel||!find(sel)){ sel=lay.items[0].node; card(sel); return; }
  var nx=nearest(sel,d[0],d[1]);
  if(nx){ sel=nx; hover=nx; card(nx); }
});

/* =================================================================== запуск */
function resize(){
  var w=Math.max(1,wrap.clientWidth||window.innerWidth||1200);
  var h=Math.max(1,wrap.clientHeight||window.innerHeight||760);
  var nw=Math.round(w*DPR), nh=Math.round(h*DPR);
  if(nw!==W||nh!==H){
    W=nw;H=nh; cv.width=W;cv.height=H; uc.width=W;uc.height=H;
    makeFBO(); panX=W*0.13; panY=H*0.21; relayout();
  }
}
function noGL(){
  function top(kind,n){
    return NODES.filter(function(o){ return o.kind===kind; })
      .sort(function(a,b){ return b.n-a.n; }).slice(0,n);
  }
  function plural(n,a,b,c){ var x=n%100,y=n%10;
    return (x>10&&x<20)?c:(y===1?a:(y>=2&&y<=4?b:c)); }
  function list(rows){ return '<ol>'+rows.map(function(o){
    return '<li>'+esc(o.name)+'<span>'+o.n+' '+plural(o.n,'трек','трека','треков')+
      '</span></li>'; }).join('')+'</ol>'; }
  wrap.innerHTML='<div id="nogl"><div class="in"><h1>Music Cosmos</h1>'+
    '<p>Карта рисуется на WebGL2, а этот браузер его не даёт. Библиотека от этого '+
    'никуда не делась — вот она списком: '+ROOT.n+' трека, '+
    NODES.filter(function(o){return o.kind==='artist';}).length+' авторов.</p>'+
    '<h2 style="font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8b93ad;margin:22px 0 10px">Жанры и эпохи</h2>'+
    list(top('genre',20))+
    '<h2 style="font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8b93ad;margin:22px 0 10px">Авторы</h2>'+
    list(top('artist',20))+'</div></div>';
}
if(!gl){ noGL(); }
else {
  initGL();
  uW=gl.getUniformLocation(pWeb,'uRes'); uPan=gl.getUniformLocation(pWeb,'uPan');
  uD=gl.getUniformLocation(pDot,'uRes');
  uT=gl.getUniformLocation(pTone,'uTex'); uE=gl.getUniformLocation(pTone,'uExp');
  resize(); refreshChrome();
  if(window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  else window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(RAF) cancelAnimationFrame(RAF); RAF=0; }
    else if(!RAF) RAF=requestAnimationFrame(frame);
  });
  RAF=requestAnimationFrame(frame);
}
window.app=function(){ return {node:cur.name, kind:cur.kind, children:cur.ch.length,
  pick:lay&&lay.pick, labels:lay&&lay.labels, scores:lay&&lay.scores, tracks:cur.n, zoom:+zoom.toFixed(2),
  hdr:HDR, dots:dN, sel:sel&&sel.name, path:ancestors(cur).map(function(o){return o.name;})}; };
window.appEnter=function(name){
  var it=(lay&&lay.items||[]).filter(function(o){ return o.node.name===name; })[0];
  if(it){ enter(it.node); return true; } return false; };
window.appUp=up;
})();
</script>
